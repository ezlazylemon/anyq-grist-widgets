<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Закупки APORT</title>
<style>
  :root{
    --bg:#F1F2F4; --card:#FFFFFF; --ink:#1F2328; --muted:#68707A; --line:#D9DDE2;
    --accent:#2563B8; --up:#188A50; --down:#C6402E; --warn:#8A6A2B;
    --input:#FFFFFF; --hover:#F4F6F8; --seg-bg:#E7E9EC;
    /* смысловые цвета — только текстом на нейтральной подложке, без заливок */
    --up-bg:#F1F4F2; --down-bg:#F6F1F0; --warn-bg:#F5F2EC;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17191C; --card:#1F2226; --ink:#E8EAEC; --muted:#8C939B; --line:#33383E;
           --input:#191C1F; --hover:#262A2F; --seg-bg:#2A2E33;
           --up:#5BB07E; --down:#D98A7C; --warn:#C4A46A;
           --up-bg:#22262A; --down-bg:#2A2426; --warn-bg:#2A2723; }
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:13px; line-height:1.4; padding:12px 14px 22px}
  .num{font-variant-numeric:tabular-nums}
  h2{font-size:13px; font-weight:600; margin-bottom:8px; display:flex; align-items:baseline; gap:8px}
  h2 .sub{color:var(--muted); font-weight:400; font-size:12px}
  h2 .cnt{margin-left:auto; color:var(--muted); font-weight:400; font-size:12px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 14px}
  button{font:inherit; cursor:pointer}
  select,input{font:inherit; color:var(--ink); background:var(--input);
    border:1px solid var(--line); border-radius:6px; padding:5px 8px; max-width:100%}
  select:hover,input:hover{border-color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .toolbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px}
  .pills{display:flex; gap:2px; border-radius:6px; background:var(--seg-bg); padding:2px}
  .pill{border:0; background:transparent; color:var(--muted); padding:5px 12px; border-radius:5px}
  .pill:hover{color:var(--ink)}
  .pill.on{background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:6px 11px}
  .btn:hover{background:var(--hover)}
  .btn.primary:hover{filter:brightness(1.07)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .btn.ghost{color:var(--accent); border-color:var(--accent)}
  .btn.sm{padding:3px 9px; font-size:12px}
  .btn:disabled{opacity:.5; cursor:default}
  .spacer{flex:1}
  .signals{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); border-radius:20px; padding:5px 12px; font-size:12px}
  .chip::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--line)}
  .chip.alert{color:var(--ink)}
  .chip.alert::before{background:var(--warn)}
  .grid{display:grid; gap:10px; grid-template-columns:1fr 1fr}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .grid .wide{grid-column:1/-1}
  .list{display:flex; flex-direction:column; max-height:460px; overflow:auto}
  .li{display:flex; gap:9px; align-items:baseline; padding:7px 2px; border-top:1px solid var(--line)}
  .li:first-child{border-top:0}
  .li .d{color:var(--muted); font-size:12px; flex:none; width:42px}
  .li .t{flex:1; min-width:0}
  .li .t .sub{color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .li .a{font-weight:600; white-space:nowrap}
  .li .acts{display:flex; gap:5px; flex:none}
  .empty-line{color:var(--muted); padding:12px 2px}
  .badge{font-size:11px; font-weight:600; border-radius:4px; padding:2px 7px; white-space:nowrap;
    background:var(--hover)}
  .badge.wait{color:var(--warn)}
  .badge.ok{color:var(--up)}
  .badge.draft{color:var(--muted)}
  .badge.late{color:var(--down)}
  .del{border:0; background:none; color:var(--muted); font-size:16px; line-height:1; padding:0 2px}
  .del:hover{color:var(--down)}
  .mback{position:fixed; inset:0; background:rgba(15,17,20,.45); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 14px}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:8px;
    width:100%; max-width:480px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .modal h3{font-size:14px; margin-bottom:10px; display:flex}
  .modal h3 .x{margin-left:auto; border:0; background:none; color:var(--muted); font-size:18px; line-height:1; padding:0 2px}
  .form{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .form .widef{grid-column:1/-1}
  .form label{display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted)}
  .form label>*{width:100%}
  .hint{grid-column:1/-1; font-size:12px; color:var(--muted); background:var(--hover); border-radius:5px; padding:6px 9px}
  .hint.warn{background:var(--down-bg); color:var(--down); font-weight:600}
  .msg{font-size:12px; margin-left:8px}
  .msg.ok{color:var(--up)} .msg.err{color:var(--down)}
  .empty{padding:40px 20px; text-align:center; color:var(--muted)}
  table{width:100%; border-collapse:collapse}
  th{font-size:11px; color:var(--muted); font-weight:500; text-align:right; padding:3px 6px; border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:4px 6px; text-align:right; border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<div id="app"><div class="empty">Загрузка данных…</div></div>
<script src="https://work.anyq.chat/grist-plugin-api.js"></script>
<script>
"use strict";
const TZ="Asia/Aqtobe";
const fmt=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n||0);
const dayKey=d=>new Intl.DateTimeFormat("sv-SE",{timeZone:TZ}).format(d);
const RU_DD=k=>k?new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"2-digit",month:"2-digit"}).format(new Date(k+"T12:00:00")):"";
const RU_D=k=>k?new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"numeric",month:"long"}).format(new Date(k+"T12:00:00")):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const epoch=k=>Math.floor(Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))/1000);
const dstr=v=>v instanceof Date?dayKey(v):(typeof v==="number"&&v?dayKey(new Date(v*1000)):"");
const cols=t=>{const ks=Object.keys(t),n=t.id.length,out=[];
  for(let i=0;i<n;i++){const o={};ks.forEach(k=>o[k]=t[k][i]);out.push(o);}return out;};

let reqs=[],items=[],sups={},supOrder=[],deps={},depOrder=[],bills=[];
let tab="bills", modal=null, fv={}, uiMsg="", noBills=false;
// modalReturn: куда вернуть id только что созданного поставщика, если форма
// поставщика была открыта «быстрым» способом поверх счёта/позиции заявки
let prevModal=null, prevFv=null, modalReturn=null, itemKeySeq=1;

const depName=id=>deps[id]?.name||"";
const supName=id=>sups[id]?.Name||"";

async function loadAll(){
  const get=async t=>{try{return await grist.docApi.fetchTable(t);}catch(e){return null;}};
  const [pr,pi,su,de,bi]=await Promise.all(
    ["Purchase_requests","Purchase_Request_Items","Suppliers","Departments","Bills"].map(get));
  reqs=pr?cols(pr).map(r=>({...r,ed:dstr(r.Expected_date),cd:dstr(r.Created_at)})):[];
  items=pi?cols(pi):[];
  sups={};supOrder=[];
  if(su)cols(su).forEach(r=>{sups[r.id]=r;supOrder.push(r.id);});
  deps={};depOrder=[];
  if(de)cols(de).forEach(r=>{deps[r.id]=r;if(r.is_sales!==false)depOrder.push(r.id);});
  noBills=!bi;
  bills=bi?cols(bi).map(r=>({...r,dk:dstr(r.date_added)}))
    .sort((a,b)=>(b.dk||"").localeCompare(a.dk||"")||b.id-a.id):[];
}

const itemSum=i=>i.Total_price||((i.Quantity||0)*(i.Unit_price||0))||0;
function reqTotal(r){
  const own=items.filter(i=>i.Request_ID===r.id);
  return own.length?own.reduce((s,i)=>s+itemSum(i),0):(r.Total_amount||0);
}
const reqDep=r=>r.department_ref||0;

// в одной заявке позиции могут быть от разных поставщиков:
// счёт выставляется на конкретного, сумма считается по его позициям
function reqBySupplier(reqId){
  const map=new Map();
  items.filter(i=>i.Request_ID===reqId).forEach(i=>{
    const sid=i.Supplier||0;
    const cur=map.get(sid)||{sum:0,names:[]};
    cur.sum+=itemSum(i);
    if(i.Item_name)cur.names.push(i.Item_name);
    map.set(sid,cur);});
  return [...map.entries()].map(([sid,v])=>({sid,sum:Math.round(v.sum*100)/100,names:v.names}))
    .sort((a,b)=>b.sum-a.sum);
}
const billedFor=(reqId,sid)=>bills.filter(b=>b.request===reqId&&(sid===undefined||b.supplier===sid))
  .reduce((s,b)=>s+(b.amount||0),0);

// Дубль и переплата: счёт по паре «заявка + поставщик» уже может быть,
// а сумма счетов может превысить позиции поставщика в заявке. Не запрещаем
// (бывают предоплата и доплата), но требуем осознанного подтверждения.
function billWarning(f){
  const reqId=+f.req||0, sid=+f.sup||0, amt=parseFloat(f.amt)||0;
  if(!reqId)return "";
  const others=bills.filter(b=>b.request===reqId&&b.supplier===sid&&b.id!==f.id);
  const parts=reqBySupplier(reqId);
  const planned=(parts.find(p=>p.sid===sid)||{}).sum||0;
  const already=others.reduce((s,b)=>s+(b.amount||0),0);
  const msgs=[];
  if(others.length){
    const list=others.map(b=>`${fmt(b.amount)} ₸ от ${RU_DD(b.dk)}${b.paid?", оплачен":b.ready?", у казначея":""}`).join("; ");
    msgs.push(`По этому поставщику в заявке уже есть ${others.length===1?"счёт":"счета"}: ${list}.`);
  }
  if(planned&&amt&&already+amt>planned+0.5){
    msgs.push(`Сумма счетов превысит позиции поставщика в заявке на ${fmt(already+amt-planned)} ₸ (в заявке ${fmt(planned)} ₸).`);
  }
  return msgs.join(" ");
}

function billStatus(b){
  if(b.paid)return {cls:"ok",txt:"оплачен"};
  if(b.ready)return {cls:"wait",txt:b.synced?"у казначея":"к оплате"};
  return {cls:"draft",txt:"черновик"};
}

const rowTotal=it=>{const q=parseFloat(it.qty)||0,p=parseFloat(it.price)||0;return q*p;};

function nextPRNumber(){
  let max=0;
  reqs.forEach(r=>{const m=/^PR-(\d+)$/.exec(String(r.PR_Number||"").trim()); if(m)max=Math.max(max,+m[1]);});
  return "PR-"+String(max+1).padStart(4,"0");
}

// открыть мини-форму поставщика поверх текущей (счёт/позиция заявки);
// после сохранения новый id возвращается в исходную форму через modalReturn
function openSupplierQuick(returnTo){
  prevModal=modal; prevFv=fv; modalReturn=returnTo;
  modal="sup"; fv={}; uiMsg=""; render();
}

// снимок формы заявки: и «шапка», и позиции — иначе add/remove строки
// теряет то, что закупщик уже успел напечатать в других полях/строках
function grabReqForm(){
  const g=id=>document.getElementById(id);
  const itemsList=(fv.itemsList||[]).map(it=>{
    const name=g("ri-name-"+it._key)?.value, qty=g("ri-qty-"+it._key)?.value,
      price=g("ri-price-"+it._key)?.value, supEl=g("ri-sup-"+it._key);
    return {...it,
      name:name!==undefined?name:it.name, qty:qty!==undefined?qty:it.qty,
      price:price!==undefined?price:it.price, sup:supEl?supEl.value:it.sup};
  });
  return {...fv, id:fv.id,
    dep:g("r-dep")?.value, by:g("r-by")?.value, priority:g("r-priority")?.value,
    ed:g("r-ed")?.value, status:g("r-status")?.value, itemsList};
}

function modalHtml(){
  if(!modal)return"";
  const todayK=dayKey(new Date());
  if(modal==="bill"){
    const linkedReq=fv.req?reqs.find(r=>r.id===+fv.req):null;
    return `<div class="mback" data-close><div class="modal">
      <h3>${fv.id?"Правка счёта":"Новый счёт на оплату"}<button class="x" data-close>×</button></h3>
      <div class="form">
        <label>Дата счёта<input type="date" id="f-date" value="${fv.date||todayK}"></label>
        <label>Точка<select id="f-dep">${depOrder.map(id=>`<option value="${id}"${+fv.dep===id?" selected":""}>${esc(depName(id))}</option>`).join("")}</select></label>
        <label>Поставщик<select id="f-sup"><option value="0">— выбрать —</option>
          ${supOrder.map(id=>`<option value="${id}"${+fv.sup===id?" selected":""}>${esc(supName(id))}</option>`).join("")}
          <option value="__new__">+ создать поставщика</option></select></label>
        <label>Сумма, ₸<input type="number" id="f-amt" min="1" step="1" value="${esc(fv.amt||"")}" placeholder="0"></label>
        <label class="widef">Заявка<select id="f-req"><option value="0">— без заявки —</option>
          ${reqs.map(r=>`<option value="${r.id}"${+fv.req===r.id?" selected":""}>${esc(String(r.PR_Number||("заявка "+r.id)))} · ${esc(depName(reqDep(r)))} · ${fmt(reqTotal(r))} ₸</option>`).join("")}</select></label>
        <label class="widef">Файл счёта<input type="file" id="f-file" accept="image/*,application/pdf"></label>
        <label class="widef">Комментарий<input type="text" id="f-note" value="${esc(fv.note||"")}" placeholder="за что"></label>
        ${linkedReq?(()=>{
          const parts=reqBySupplier(linkedReq.id);
          const done=billedFor(linkedReq.id);
          const rest=reqTotal(linkedReq)-done;
          const bySup=parts.length>1?`<div style="margin-top:5px">Поставщики заявки: `+
            parts.map(p=>{
              const b=billedFor(linkedReq.id,p.sid);
              return `<button type="button" class="btn sm" data-part="${p.sid}" data-sum="${p.sum}">${esc(supName(p.sid)||"без поставщика")}: ${fmt(p.sum)}${b?" (выставлено "+fmt(b)+")":""}</button>`;}).join(" ")+`</div>`:"";
          return `<div class="hint">Заявка на ${fmt(reqTotal(linkedReq))} ₸, статус: ${esc(linkedReq.Status||"—")}.
            ${done?`Уже выставлено счетов: ${fmt(done)} ₸, остаток ${fmt(rest)} ₸.`:"Счетов по ней ещё нет."}${bySup}</div>`;})():""}
        ${(()=>{const w=billWarning(fv); return w?`<div class="hint warn">${w}</div>`:"";})()}
        <div class="widef">
          <button class="btn primary" id="f-save">${billWarning(fv)&&!fv.force?"Всё равно создать":(fv.id?"Сохранить":"Создать")}</button>
          <button class="btn ghost" id="f-saveready">${fv.id?"Сохранить и отправить":"Создать и отправить"}</button>
          <span class="msg ${uiMsg.startsWith("Ошибка")?"err":"ok"}">${esc(uiMsg)}</span></div>
      </div></div></div>`;
  }
  if(modal==="delbill"){
    return `<div class="mback" data-close><div class="modal">
      <h3>Удалить счёт<button class="x" data-close>×</button></h3>
      <div class="form"><div class="hint widef">${esc(fv.label||"")}</div>
        <div class="widef"><button class="btn primary" id="f-del">Удалить</button>
          <button class="btn" data-close>Отмена</button>
          <span class="msg err">${esc(uiMsg)}</span></div></div></div></div>`;
  }
  if(modal==="req"){
    const list=fv.itemsList||[];
    const total=list.reduce((s,it)=>s+rowTotal(it),0);
    const supOpts=cur=>`<option value="0">— без поставщика —</option>`+
      supOrder.map(id=>`<option value="${id}"${+cur===id?" selected":""}>${esc(supName(id))}</option>`).join("")+
      `<option value="__new__">+ создать поставщика</option>`;
    const rows=list.map(it=>`<tr>
        <td><input type="text" id="ri-name-${esc(it._key)}" value="${esc(it.name||"")}" placeholder="наименование" style="width:100%"></td>
        <td><input type="number" id="ri-qty-${esc(it._key)}" min="0" step="1" value="${esc(it.qty??1)}" style="width:56px"></td>
        <td><input type="number" id="ri-price-${esc(it._key)}" min="0" step="1" value="${esc(it.price??0)}" style="width:84px"></td>
        <td><select id="ri-sup-${esc(it._key)}">${supOpts(it.sup||0)}</select></td>
        <td class="num">${fmt(rowTotal(it))}</td>
        <td><button type="button" class="del" data-delitemrow="${esc(it._key)}">×</button></td>
      </tr>`).join("");
    return `<div class="mback" data-close><div class="modal" style="max-width:640px">
      <h3>${fv.id?"Правка заявки":"Новая заявка"}<button class="x" data-close>×</button></h3>
      <div class="form">
        <label>Точка<select id="r-dep">${depOrder.map(id=>`<option value="${id}"${+fv.dep===id?" selected":""}>${esc(depName(id))}</option>`).join("")}</select></label>
        <label>Кто заказал<input type="text" id="r-by" value="${esc(fv.by||"")}"></label>
        <label>Приоритет<select id="r-priority">
          ${["Срочно","Планово","Низкий"].map(p=>`<option value="${p}"${fv.priority===p?" selected":""}>${p}</option>`).join("")}</select></label>
        <label>Ожидаемая дата<input type="date" id="r-ed" value="${esc(fv.ed||"")}"></label>
        <label class="widef">Статус<select id="r-status">
          ${["Pending","Approved","Rejected","Ordered","Received"].map(s=>`<option value="${s}"${fv.status===s?" selected":""}>${s}</option>`).join("")}</select></label>
        <div class="widef">
          <table><tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Поставщик</th><th>Сумма</th><th></th></tr>
          ${rows||`<tr><td colspan="6" class="empty-line">Позиций нет.</td></tr>`}</table>
          <button type="button" class="btn sm" id="r-additem" style="margin-top:6px">+ строка</button>
        </div>
        <div class="hint widef">Итого по позициям: ${fmt(total)} ₸</div>
        <div class="widef">
          <button class="btn primary" id="r-save">${fv.id?"Сохранить":"Создать"}</button>
          <span class="msg ${uiMsg.startsWith("Ошибка")?"err":"ok"}">${esc(uiMsg)}</span></div>
      </div></div></div>`;
  }
  if(modal==="delreq"){
    return `<div class="mback" data-close><div class="modal">
      <h3>Удалить заявку<button class="x" data-close>×</button></h3>
      <div class="form"><div class="hint widef">${esc(fv.label||"")}</div>
        <div class="widef"><button class="btn primary" id="f-delreq">Удалить</button>
          <button class="btn" data-close>Отмена</button>
          <span class="msg err">${esc(uiMsg)}</span></div></div></div></div>`;
  }
  if(modal==="sup"){
    return `<div class="mback" data-close><div class="modal">
      <h3>${fv.id?"Правка поставщика":"Новый поставщик"}<button class="x" data-close>×</button></h3>
      <div class="form">
        <label class="widef">Название<input type="text" id="s-name" value="${esc(fv.name||"")}"></label>
        <label>Контактное лицо<input type="text" id="s-contact" value="${esc(fv.contact||"")}"></label>
        <label>Телефон<input type="text" id="s-phone" value="${esc(fv.phone||"")}"></label>
        <label class="widef">Адрес<input type="text" id="s-address" value="${esc(fv.address||"")}"></label>
        <div class="widef">
          <button class="btn primary" id="s-save">${fv.id?"Сохранить":"Создать"}</button>
          <span class="msg ${uiMsg.startsWith("Ошибка")?"err":"ok"}">${esc(uiMsg)}</span></div>
      </div></div></div>`;
  }
  if(modal==="delsup"){
    return `<div class="mback" data-close><div class="modal">
      <h3>Удалить поставщика<button class="x" data-close>×</button></h3>
      <div class="form"><div class="hint widef${fv.blocked?" warn":""}">${esc(fv.blocked?fv.reason:fv.label||"")}</div>
        <div class="widef">${fv.blocked?"":'<button class="btn primary" id="f-delsup">Удалить</button>'}
          <button class="btn" data-close>Отмена</button>
          <span class="msg err">${esc(uiMsg)}</span></div></div></div></div>`;
  }
  return "";
}

function render(){
  const app=document.getElementById("app");
  const todayK=dayKey(new Date());
  const draft=bills.filter(b=>!b.ready&&!b.paid);
  const sent=bills.filter(b=>b.ready&&!b.paid);
  const paid=bills.filter(b=>b.paid);
  const late=reqs.filter(r=>r.ed&&r.ed<todayK&&!r.Is_received&&(r.Status||"")!=="Rejected");
  const waitDocs=reqs.filter(r=>(r.Status||"")==="Approved"&&!bills.some(b=>b.request===r.id));

  const chip=(on,txt)=>`<span class="chip${on?" alert":""}">${txt}</span>`;
  const signals=`<div class="signals">
    ${chip(draft.length>0,`Черновики счетов: ${draft.length||"нет"}`)}
    ${chip(sent.length>0,`Ждут оплаты: ${sent.length?sent.length+" на "+fmt(sent.reduce((a,b)=>a+(b.amount||0),0))+" ₸":"нет"}`)}
    ${chip(late.length>0,`Просрочена доставка: ${late.length||"нет"}`)}
    ${chip(waitDocs.length>0,`Заявки без счёта: ${waitDocs.length||"нет"}`)}
  </div>`;

  const billRow=b=>{
    const st=billStatus(b);
    const req=b.request?reqs.find(r=>r.id===b.request):null;
    // счета-двойники по паре «заявка + поставщик» видны сразу, без открытия окна
    const twins=b.request?bills.filter(x=>x.request===b.request&&x.supplier===b.supplier):[];
    const dup=twins.length>1?`<span class="badge late" title="${esc(twins.map(x=>fmt(x.amount)+' ₸ от '+RU_DD(x.dk)).join('; '))}">дубль ${twins.findIndex(x=>x.id===b.id)+1} из ${twins.length}</span>`:"";
    return `<div class="li">
      <span class="d num">${RU_DD(b.dk)}</span>
      <span class="t"><b>${esc(b.supplier_name||supName(b.supplier)||"Поставщик")}</b> ${dup}
        <div class="sub">${esc(depName(b.department))}${req?", заявка "+esc(String(req.PR_Number||req.id)):""}${b.note?", "+esc(b.note):""}</div></span>
      <span class="a num">${fmt(b.amount)}</span>
      <span class="badge ${st.cls}">${st.txt}</span>
      <span class="acts">${b.paid?"":`
        ${b.ready?`<button class="btn sm" data-unready="${b.id}">Вернуть</button>`
                 :`<button class="btn primary sm" data-ready="${b.id}">Отправить</button>`}
        <button class="btn sm" data-editbill="${b.id}">Правка</button>
        <button class="del" data-delbill="${b.id}">×</button>`}</span></div>`;};

  const listBills=(arr,empty)=>arr.length?arr.map(billRow).join(""):`<div class="empty-line">${empty}</div>`;

  const reqRow=r=>{
    const dep=reqDep(r),total=reqTotal(r);
    const has=bills.filter(b=>b.request===r.id);
    const paidSum=has.filter(b=>b.paid).reduce((s,b)=>s+(b.amount||0),0);
    const parts=reqBySupplier(r.id);
    const covered=billedFor(r.id);
    const restTxt=parts.length>1?`, поставщиков: ${parts.length}${covered<total?`, не выставлено ${fmt(total-covered)}`:""}`:"";
    const st=r.Is_received?{cls:"ok",txt:"получено"}
      :(r.ed&&r.ed<todayK)?{cls:"late",txt:"просрочено"}
      :{cls:"wait",txt:esc(r.Status||"в работе")};
    const acts=[];
    if(!r.Is_received&&r.Status!=="Ordered")acts.push(`<button class="btn sm" data-order="${r.id}">Заказано</button>`);
    if(!r.Is_received)acts.push(`<button class="btn sm" data-received="${r.id}">Получено</button>`);
    if(!(covered>=total&&has.length))acts.push(`<button class="btn ghost sm" data-billfor="${r.id}">Выставить счёт</button>`);
    acts.push(`<button class="btn sm" data-editreq="${r.id}">Правка</button>`);
    acts.push(`<button class="del" data-delreq="${r.id}">×</button>`);
    return `<div class="li">
      <span class="d num">${RU_DD(r.ed)}</span>
      <span class="t"><b>${esc(String(r.PR_Number||("Заявка "+r.id)))}</b>
        <div class="sub">${esc(depName(dep))}${r.Requested_by?", "+esc(r.Requested_by):""}${has.length?`, счетов: ${has.length}${paidSum?" (оплачено "+fmt(paidSum)+")":""}`:", счёта нет"}${restTxt}</div></span>
      <span class="a num">${fmt(total)}</span>
      <span class="badge ${st.cls}">${st.txt}</span>
      <span class="acts">${acts.join(" ")}</span></div>`;};

  const supRow=id=>{
    const s=sups[id];
    const bs=bills.filter(b=>b.supplier===id);
    const sum=bs.reduce((a,b)=>a+(b.amount||0),0);
    const unpaidSum=bs.filter(b=>!b.paid).reduce((a,b)=>a+(b.amount||0),0);
    return `<tr><td>${esc(s.Name||"")}<div class="sub">${esc(s.Contact_person||"")}${s.Phone?", "+esc(s.Phone):""}</div></td>
      <td class="num">${bs.length}</td><td class="num">${fmt(sum)}</td>
      <td class="num">${unpaidSum?fmt(unpaidSum):"0"}</td>
      <td><button class="btn sm" data-editsup="${id}">Правка</button> <button class="del" data-delsup="${id}">×</button></td></tr>`;};

  let body="";
  if(noBills){
    body=`<div class="card"><div class="empty-line">Таблица Bills ещё не создана в этом документе.
      Запустите setup_purchase_doc.py --run и обновите страницу.</div></div>`;
  } else if(tab==="bills"){
    body=`<div class="grid">
      <div class="card"><h2>Черновики <span class="sub">не отправлены казначею</span><span class="cnt">${draft.length} шт</span></h2>
        <div class="list">${listBills(draft,"Черновиков нет.")}</div></div>
      <div class="card"><h2>Ждут оплаты<span class="cnt">${sent.length} шт, ${fmt(sent.reduce((a,b)=>a+(b.amount||0),0))} ₸</span></h2>
        <div class="list">${listBills(sent,"Счетов на оплате нет.")}</div></div>
      <div class="card wide"><h2>Оплаченные <span class="sub">последние</span><span class="cnt">${paid.length} шт, ${fmt(paid.reduce((a,b)=>a+(b.amount||0),0))} ₸</span></h2>
        <div class="list">${listBills(paid.slice(0,30),"Оплаченных счетов пока нет.")}</div></div>
    </div>`;
  } else if(tab==="reqs"){
    const open=reqs.filter(r=>!r.Is_received);
    const done=reqs.filter(r=>r.Is_received);
    body=`<div class="grid">
      <div class="card wide"><h2>В работе <span class="sub">заказано, не получено</span><span class="cnt">${open.length} шт</span></h2>
        <div class="list">${open.length?open.map(reqRow).join(""):`<div class="empty-line">Открытых заявок нет.</div>`}</div></div>
      <div class="card wide"><h2>Получено<span class="cnt">${done.length} шт</span></h2>
        <div class="list">${done.length?done.map(reqRow).join(""):`<div class="empty-line">Пока пусто.</div>`}</div></div>
    </div>`;
  } else {
    body=`<div class="card"><h2>Поставщики<span class="cnt">${supOrder.length} шт</span></h2>
      <table><tr><th>Поставщик</th><th>Счетов</th><th>Сумма</th><th>Не оплачено</th><th></th></tr>
      ${supOrder.length?supOrder.map(supRow).join(""):`<tr><td colspan="5" class="empty-line">Поставщиков нет.</td></tr>`}</table></div>`;
  }

  app.innerHTML=`
    <div class="toolbar">
      <div class="pills">
        <button class="pill${tab==="bills"?" on":""}" data-tab="bills">Счета</button>
        <button class="pill${tab==="reqs"?" on":""}" data-tab="reqs">Заявки</button>
        <button class="pill${tab==="sups"?" on":""}" data-tab="sups">Поставщики</button>
      </div>
      <span class="spacer"></span>
      <button class="btn primary" id="btn-bill"${noBills?" disabled":""}>+ Счёт на оплату</button>
      <button class="btn primary" id="btn-req">+ Заявка</button>
      <button class="btn primary" id="btn-sup">+ Поставщик</button>
    </div>
    ${signals}
    ${body}
    ${modalHtml()}`;
  wire();
}

// Загрузка вложения. Grist 1.7.18 не отдаёт виджету токен доступа
// (эндпоинта /access/token нет), поэтому при хостинге на своём сервисе
// файл уходит через его /upload, где ключ лежит на стороне сервера.
// На стороннем хостинге (github.io) прикрепить файл нельзя — сообщаем честно.
async function uploadInvoice(file){
  const docId=(await grist.docApi.getDocName?.())||window.__docId||"";
  const sameHost=location.origin&&!/github\.io$/.test(location.hostname);
  if(!sameHost)throw new Error("виджет открыт не с сервера AnyQ");
  const fd=new FormData();
  fd.append("upload",file,file.name);
  const res=await fetch(`/upload?doc=${encodeURIComponent(docId)}`,{method:"POST",body:fd});
  if(!res.ok)throw new Error("сервер ответил "+res.status);
  const ids=await res.json();
  return Array.isArray(ids)?ids:[ids];
}

const grab=()=>{const g=id=>document.getElementById(id);
  return {id:fv.id,date:g("f-date")?.value,dep:g("f-dep")?.value,sup:g("f-sup")?.value,
          amt:g("f-amt")?.value,req:g("f-req")?.value,note:g("f-note")?.value};};

function wire(){
 try{
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
  const add=document.getElementById("btn-bill");
  if(add)add.onclick=()=>{modal="bill";uiMsg="";fv={dep:depOrder[0]};render();};
  const addReq=document.getElementById("btn-req");
  if(addReq)addReq.onclick=()=>{modal="req";uiMsg="";
    fv={dep:depOrder[0],priority:"Планово",status:"Pending",ed:dayKey(new Date()),itemsList:[]};render();};
  const addSup=document.getElementById("btn-sup");
  if(addSup)addSup.onclick=()=>{modal="sup";uiMsg="";fv={};render();};
  document.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click",e=>{
    if(e.target===el||el.tagName==="BUTTON"){
      // «быстрое» окно поставщика было открыто поверх счёта/заявки — возвращаемся
      // туда, а не закрываем всё: закупщик не должен терять уже введённые данные
      if(modalReturn){modal=prevModal;fv=prevFv;prevModal=null;prevFv=null;modalReturn=null;}
      else{modal=null;}
      uiMsg="";render();}}));

  document.querySelectorAll("[data-billfor]").forEach(b=>b.onclick=()=>{
    const r=reqs.find(x=>x.id===+b.dataset.billfor);
    const parts=reqBySupplier(r.id);
    // если поставщик в заявке один — подставляем его и сумму по его позициям;
    // если несколько — сумму не угадываем, закупщик выбирает поставщика в окне
    const single=parts.length===1?parts[0]:null;
    modal="bill";uiMsg="";
    fv={dep:reqDep(r)||depOrder[0],req:r.id,
        amt:single?single.sum:"",sup:single?single.sid:0,
        note:`по заявке ${r.PR_Number||r.id}`};
    render();});

  document.querySelectorAll("[data-editbill]").forEach(b=>b.onclick=()=>{
    const x=bills.find(v=>v.id===+b.dataset.editbill); if(!x)return;
    modal="bill";uiMsg="";
    fv={id:x.id,date:x.dk,dep:x.department,sup:x.supplier,amt:x.amount,req:x.request,note:x.note||""};
    render();});

  document.querySelectorAll("[data-delbill]").forEach(b=>b.onclick=()=>{
    const x=bills.find(v=>v.id===+b.dataset.delbill); if(!x)return;
    modal="delbill";uiMsg="";
    fv={id:x.id,label:`${RU_DD(x.dk)}, ${x.supplier_name||supName(x.supplier)||"поставщик"}, ${fmt(x.amount)} ₸`};
    render();});
  const del=document.getElementById("f-del");
  if(del)del.onclick=async()=>{
    del.disabled=true;
    try{ await grist.docApi.applyUserActions([["RemoveRecord","Bills",fv.id]]);
      modal=null;await loadAll();render();
    }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}};

  document.querySelectorAll("[data-ready]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ await grist.docApi.applyUserActions([["UpdateRecord","Bills",+b.dataset.ready,{ready:true}]]);
      await loadAll();render();
    }catch(e){b.disabled=false;uiMsg="Ошибка: "+(e.message||e);render();}});
  document.querySelectorAll("[data-unready]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ await grist.docApi.applyUserActions([["UpdateRecord","Bills",+b.dataset.unready,{ready:false}]]);
      await loadAll();render();
    }catch(e){b.disabled=false;uiMsg="Ошибка: "+(e.message||e);render();}});

  // при выборе заявки перерисовываем окно: появятся её поставщики и остаток
  // смена заявки, поставщика или суммы сбрасывает подтверждение и обновляет предупреждение
  ["f-req","f-sup","f-amt"].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.onchange=()=>{
      if(id==="f-sup"&&el.value==="__new__"){fv=grab();openSupplierQuick({type:"bill"});return;}
      fv=grab();fv.force=false;render();};});
  document.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{
    fv=grab();fv.sup=b.dataset.part;fv.amt=b.dataset.sum;
    const nm=supName(+b.dataset.part);
    const req=reqs.find(r=>r.id===+fv.req);
    fv.note=`по заявке ${req?.PR_Number||fv.req}${nm?", "+nm:""}`;
    render();});

  // --- заявки: быстрая смена статуса прямо в строке ---
  document.querySelectorAll("[data-order]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ await grist.docApi.applyUserActions([["UpdateRecord","Purchase_requests",+b.dataset.order,{Status:"Ordered"}]]);
      await loadAll();render();
    }catch(e){b.disabled=false;uiMsg="Ошибка: "+(e.message||e);render();}});
  document.querySelectorAll("[data-received]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{ await grist.docApi.applyUserActions([["UpdateRecord","Purchase_requests",+b.dataset.received,{Is_received:true,Status:"Received"}]]);
      await loadAll();render();
    }catch(e){b.disabled=false;uiMsg="Ошибка: "+(e.message||e);render();}});

  // --- заявки: создание/правка (модальное окно с позициями) ---
  document.querySelectorAll("[data-editreq]").forEach(b=>b.onclick=()=>{
    const r=reqs.find(x=>x.id===+b.dataset.editreq); if(!r)return;
    const its=items.filter(i=>i.Request_ID===r.id).map(i=>
      ({_key:itemKeySeq++,id:i.id,name:i.Item_name||"",qty:i.Quantity||0,price:i.Unit_price||0,sup:i.Supplier||0}));
    modal="req";uiMsg="";
    fv={id:r.id,dep:reqDep(r)||depOrder[0],by:r.Requested_by||"",priority:r.Priority||"Планово",
        ed:r.ed||"",status:r.Status||"Pending",itemsList:its};
    render();});

  document.querySelectorAll("[data-delreq]").forEach(b=>b.onclick=()=>{
    const r=reqs.find(x=>x.id===+b.dataset.delreq); if(!r)return;
    const cnt=items.filter(i=>i.Request_ID===r.id).length;
    modal="delreq";uiMsg="";
    fv={id:r.id,label:`Удалить заявку «${r.PR_Number||r.id}»${cnt?` вместе с позициями (${cnt} шт.)`:""}?`};
    render();});
  const delReq=document.getElementById("f-delreq");
  if(delReq)delReq.onclick=async()=>{
    delReq.disabled=true;
    try{
      const its=items.filter(i=>i.Request_ID===fv.id).map(i=>["RemoveRecord","Purchase_Request_Items",i.id]);
      await grist.docApi.applyUserActions([...its,["RemoveRecord","Purchase_requests",fv.id]]);
      modal=null;await loadAll();render();
    }catch(e){delReq.disabled=false;uiMsg="Ошибка: "+(e.message||e);render();}};

  const rAdd=document.getElementById("r-additem");
  if(rAdd)rAdd.onclick=()=>{
    fv=grabReqForm();
    fv.itemsList=[...(fv.itemsList||[]),{_key:itemKeySeq++,id:null,name:"",qty:1,price:0,sup:0}];
    render();};
  document.querySelectorAll("[data-delitemrow]").forEach(b=>b.onclick=()=>{
    fv=grabReqForm();
    fv.itemsList=(fv.itemsList||[]).filter(it=>String(it._key)!==String(b.dataset.delitemrow));
    render();});
  // поставщик прямо из строки позиции: «+ создать поставщика» открывает мини-форму
  (fv.itemsList||[]).forEach(it=>{
    const sel=document.getElementById("ri-sup-"+it._key);
    if(sel)sel.onchange=()=>{
      if(sel.value==="__new__"){fv=grabReqForm();openSupplierQuick({type:"item",key:it._key});return;}
      fv=grabReqForm();render();};});

  const saveReq=async()=>{
    fv=grabReqForm();
    const depId=+fv.dep||0;
    if(!depId){uiMsg="Ошибка: выберите точку";render();return;}
    // пустая строка (добавили «+ строка» и передумали) не должна плодить
    // позицию-призрак: считаем валидной только строку с наименованием
    const validItems=(fv.itemsList||[]).filter(it=>(it.name||"").trim());
    const total=validItems.reduce((s,it)=>s+rowTotal(it),0);
    const curReq=fv.id?reqs.find(r=>r.id===+fv.id):null;
    const reqFields={department_ref:depId,Requested_by:(fv.by||"").trim(),
      Priority:fv.priority||"Планово",Expected_date:epoch(fv.ed||dayKey(new Date())),
      Status:fv.status||"Pending",Total_amount:Math.round(total*100)/100};
    if(!curReq||!curReq.PR_Number)reqFields.PR_Number=nextPRNumber();
    try{
      let reqId;
      if(fv.id){
        await grist.docApi.applyUserActions([["UpdateRecord","Purchase_requests",+fv.id,reqFields]]);
        reqId=+fv.id;
      }else{
        const res=await grist.docApi.applyUserActions([["AddRecord","Purchase_requests",null,reqFields]]);
        reqId=res&&res.retValues?res.retValues[0]:null;
      }
      if(!reqId)throw new Error("не удалось определить id заявки");
      const before=items.filter(i=>i.Request_ID===reqId);
      const keepIds=new Set(validItems.filter(it=>it.id).map(it=>+it.id));
      const itemActions=[];
      before.forEach(b=>{ if(!keepIds.has(b.id))itemActions.push(["RemoveRecord","Purchase_Request_Items",b.id]); });
      validItems.forEach(it=>{
        const f2={Request_ID:reqId,Item_name:(it.name||"").trim(),
          Quantity:parseFloat(it.qty)||0,Unit_price:parseFloat(it.price)||0,
          Total_price:Math.round(rowTotal(it)*100)/100,Supplier:+it.sup||0};
        if(it.id)itemActions.push(["UpdateRecord","Purchase_Request_Items",+it.id,f2]);
        else itemActions.push(["AddRecord","Purchase_Request_Items",null,f2]);
      });
      if(itemActions.length)await grist.docApi.applyUserActions(itemActions);
      modal=null;uiMsg="";await loadAll();render();
    }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}};
  const rSave=document.getElementById("r-save");
  // блокируем сразу по клику — та же защита от дабл-клика, что и у счёта
  if(rSave)rSave.onclick=()=>{rSave.disabled=true;saveReq();};

  // --- поставщики: создание/правка/удаление ---
  document.querySelectorAll("[data-editsup]").forEach(b=>b.onclick=()=>{
    const s=sups[+b.dataset.editsup]; if(!s)return;
    modal="sup";uiMsg="";
    fv={id:+b.dataset.editsup,name:s.Name||"",contact:s.Contact_person||"",phone:s.Phone||"",address:s.Address||""};
    render();});

  const saveSup=async()=>{
    const g=id=>document.getElementById(id);
    const name=(g("s-name")?.value||"").trim();
    if(!name){uiMsg="Ошибка: укажите название";render();return;}
    const fields={Name:name,Contact_person:(g("s-contact")?.value||"").trim(),
      Phone:(g("s-phone")?.value||"").trim(),Address:(g("s-address")?.value||"").trim()};
    try{
      let newId=fv.id?+fv.id:null;
      if(fv.id){ await grist.docApi.applyUserActions([["UpdateRecord","Suppliers",+fv.id,fields]]); }
      else{
        const res=await grist.docApi.applyUserActions([["AddRecord","Suppliers",null,fields]]);
        newId=res&&res.retValues?res.retValues[0]:null;
      }
      await loadAll();
      if(modalReturn){
        const ret=modalReturn; modalReturn=null;
        fv=prevFv; modal=prevModal; prevFv=null; prevModal=null;
        if(newId){
          if(ret.type==="bill")fv.sup=newId;
          else if(ret.type==="item")fv.itemsList=(fv.itemsList||[]).map(it=>it._key===ret.key?{...it,sup:newId}:it);
        }
      }else{ modal=null; }
      uiMsg="";render();
    }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}};
  const sSave=document.getElementById("s-save");
  if(sSave)sSave.onclick=()=>{sSave.disabled=true;saveSup();};

  document.querySelectorAll("[data-delsup]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.delsup; const s=sups[id]; if(!s)return;
    const usedBill=bills.some(x=>x.supplier===id);
    const usedItem=items.some(i=>i.Supplier===id);
    modal="delsup";uiMsg="";
    if(usedBill||usedItem){
      fv={id,blocked:true,reason:`Нельзя удалить: поставщик используется в ${usedBill?"счетах":""}${usedBill&&usedItem?" и ":""}${usedItem?"позициях заявок":""}.`};
    }else{
      fv={id,blocked:false,label:`Удалить поставщика «${s.Name||""}»?`};
    }
    render();});
  const delSup=document.getElementById("f-delsup");
  if(delSup)delSup.onclick=async()=>{
    delSup.disabled=true;
    try{ await grist.docApi.applyUserActions([["RemoveRecord","Suppliers",fv.id]]);
      modal=null;await loadAll();render();
    }catch(e){delSup.disabled=false;uiMsg="Ошибка: "+(e.message||e);render();}};

  const save=async ready=>{
    const force=fv.force;
    fv=grab(); fv.force=force;
    const amt=parseFloat(fv.amt);
    if(!amt||amt<=0){uiMsg="Ошибка: введите сумму";render();return;}
    // первый клик при дубле/переплате только предупреждает, второй — создаёт
    const warn=billWarning(fv);
    if(warn&&!fv.force){
      fv.force=true;
      uiMsg="Проверьте предупреждение выше. Нажмите ещё раз, если счёт всё равно нужен.";
      render();return;
    }
    const dk=fv.date||dayKey(new Date());
    const flds={date_added:epoch(dk),department:+fv.dep,supplier:+fv.sup||0,
      supplier_name:supName(+fv.sup)||"",request:+fv.req||0,amount:amt,
      note:(fv.note||"").trim(),created_by:"закупщик"};
    if(ready)flds.ready=true;
    const fileInput=document.getElementById("f-file");
    const file=fileInput&&fileInput.files&&fileInput.files[0];
    let fileNote="";
    // Загрузка файла не должна мешать созданию счёта: если она не удалась,
    // счёт всё равно сохраняем и честно говорим, что файла нет.
    if(file){
      try{
        const ids=await uploadInvoice(file);
        if(ids&&ids.length)flds.invoice=["L",...ids];
      }catch(e){
        fileNote=" Файл не прикрепился ("+(e.message||e)+"), добавьте его в таблице Bills.";
      }
    }
    try{
      await grist.docApi.applyUserActions([ fv.id
        ? ["UpdateRecord","Bills",fv.id,flds]
        : ["AddRecord","Bills",null,flds] ]);
      await loadAll();
      if(fileNote){uiMsg="Счёт сохранён."+fileNote;}
      else {modal=null;uiMsg="";}
      render();
    }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}};
  const s1=document.getElementById("f-save"),s2=document.getElementById("f-saveready");
  // блокируем обе кнопки сразу по клику: без этого двойной клик (или просто
  // медленная сеть/загрузка файла) успевает вызвать save() дважды и создаёт
  // счёт-дубль ДО того, как первый ответ применит правку/пересоздаст форму
  const lockSave=()=>{if(s1)s1.disabled=true;if(s2)s2.disabled=true;};
  if(s1)s1.onclick=()=>{lockSave();save(false);};
  if(s2)s2.onclick=()=>{lockSave();save(true);};
 }catch(e){console.error("wire:",e);}
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&modal){
    if(modalReturn){modal=prevModal;fv=prevFv;prevModal=null;prevFv=null;modalReturn=null;}
    else{modal=null;}
    uiMsg="";render();}});

grist.ready({requiredAccess:"full"});
grist.onRecords(async()=>{
  try{await loadAll();}catch(e){console.warn("loadAll:",e);}
  render();
});
</script>
</body>
</html>
