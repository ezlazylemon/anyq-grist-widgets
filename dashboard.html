<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Касса APORT</title>
<style>
  :root{
    --bg:#F1F2F4; --card:#FFFFFF; --ink:#1F2328; --muted:#68707A; --line:#D9DDE2;
    --accent:#2563B8; --up:#188A50; --down:#C6402E;
    --input:#FFFFFF; --hover:#F4F6F8; --seg-bg:#E7E9EC;
    /* монохромная шкала для донатов (каналы оплат, статьи расходов): от насыщенного
       к светлому по убыванию доли; --chart8 — единственный контрастный (нейтрально-
       серый) акцент, зарезервирован под «хвост» самых мелких долей */
    --chart1:#1D4FBF; --chart2:#3568D4; --chart3:#4F80DE; --chart4:#6D98E6;
    --chart5:#8FB0EC; --chart6:#B3C8F2; --chart7:#D6E2F8; --chart8:#98A2AE;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17191C; --card:#1F2226; --ink:#E8EAEC; --muted:#8C939B; --line:#33383E;
           --input:#191C1F; --hover:#262A2F; --seg-bg:#2A2E33;
           --chart1:#6C93EA; --chart2:#5580E2; --chart3:#436FD6; --chart4:#3A5FB8;
           --chart5:#334E93; --chart6:#2D4270; --chart7:#28374F; --chart8:#7A828C; }
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:13px; line-height:1.4; padding:12px 14px 22px}
  .num{font-variant-numeric:tabular-nums}
  h2{font-size:13px; font-weight:600; margin-bottom:8px; display:flex; align-items:baseline; gap:8px}
  h2 .sub{color:var(--muted); font-weight:400; font-size:12px}
  h2 .cnt{margin-left:auto; color:var(--muted); font-weight:400; font-size:12px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 14px}
  button{font:inherit; cursor:pointer}
  select,input{font:inherit; color:var(--ink); background:var(--input);
    border:1px solid var(--line); border-radius:6px; padding:5px 8px; max-width:100%}
  select:hover,input:hover{border-color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .toolbar{display:flex; gap:8px; align-items:flex-start; margin-bottom:10px}
  .tb-filters{display:flex; flex-wrap:wrap; gap:6px; align-items:center; flex:1 1 auto; min-width:0}
  .tb-actions{display:flex; gap:6px; align-items:center; flex:0 0 auto}
  @media (max-width:700px){ .toolbar{flex-wrap:wrap} }
  /* сегментированный контрол (вкладки, пилюли периодов) в духе NocoDB:
     нейтральная подложка-трек, активный элемент — светлая плашка с тенью,
     без сплошной синей заливки */
  .pills{display:flex; flex-wrap:wrap; gap:2px; border:1px solid var(--line); border-radius:6px;
    padding:2px; background:var(--seg-bg)}
  .pill{border:0; background:transparent; color:var(--muted); border-radius:4px; padding:5px 10px}
  .pill:hover:not(.on){color:var(--ink)}
  .pill.on{background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(15,17,20,.1)}
  .range{display:flex; gap:4px; align-items:center}
  .dd{position:relative}
  .dd>summary{list-style:none; cursor:pointer; border:1px solid var(--line); background:var(--card);
    border-radius:6px; padding:6px 11px; user-select:none; white-space:nowrap}
  .dd>summary:hover{background:var(--hover)}
  .dd>summary::-webkit-details-marker{display:none}
  .dd .menu{position:absolute; z-index:30; top:calc(100% + 4px); left:0; min-width:240px; max-height:300px; overflow:auto;
    background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px; box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .dd .menu .tools{display:flex; gap:6px; margin-bottom:6px}
  .dd .menu .tools button{border:1px solid var(--line); background:transparent; color:var(--accent); border-radius:6px; padding:3px 8px; font-size:12px}
  .dd .menu label{display:flex; gap:7px; align-items:center; padding:3px 4px; border-radius:4px}
  .dd .menu label:hover{background:var(--hover)}
  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:6px 11px}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{color:var(--accent); border-color:var(--line)}
  .btn.ghost:hover{background:var(--hover)}
  .btn:disabled{opacity:.5; cursor:default}
  .spacer{flex:1}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:10px}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:9px 12px}
  .kpi .t{color:var(--muted); font-size:12px}
  .kpi .v{font-size:19px; font-weight:600; margin-top:2px}
  .kpi .v.pos{color:var(--up)} .kpi .v.neg{color:var(--down)}
  .kpi .d{font-size:12px; margin-top:1px}
  .kpi .d.up{color:var(--up)} .kpi .d.down{color:var(--down)} .kpi .d.mut{color:var(--muted)}

  .grid{display:grid; gap:10px; grid-template-columns:1fr 1fr}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}
  .grid .wide{grid-column:1/-1}

  .split{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
  .donut{flex:none}
  .lg{display:flex; flex-direction:column; gap:3px; min-width:150px; flex:1}
  .lg .it{display:flex; gap:7px; align-items:baseline}
  .lg .sq{width:9px; height:9px; border-radius:2px; flex:none; align-self:center; border:1px solid rgba(0,0,0,.08)}
  .lg .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lg .vv{font-weight:600} .lg .pp{color:var(--muted); width:38px; text-align:right}

  .rows{display:flex; flex-direction:column; gap:4px}
  .row{display:grid; grid-template-columns:minmax(84px,30%) 1fr auto auto 44px; gap:9px; align-items:center; padding:1px 0}
  .pdelta{font-size:12px; font-weight:600; text-align:right}
  .pdelta.up{color:var(--up)} .pdelta.down{color:var(--down)}
  .row .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .track{height:7px; border-radius:3px; background:var(--line); overflow:hidden}
  .row .track i{display:block; height:100%; background:var(--accent)}
  .row .val{font-size:12px}
  .row.zero .name,.row.zero .val{color:var(--down); font-weight:600}
  .row[data-point]{cursor:pointer; border-radius:4px; padding:2px 4px; margin:0 -4px}
  .row[data-point]:hover{background:var(--hover)}
  .row.only{background:var(--hover); box-shadow:inset 2px 0 0 var(--accent)}

  .chart{display:flex; align-items:flex-end; gap:2px; height:120px; padding-top:14px}
  .cb{flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; position:relative}
  .cb{max-width:52px}
  .cb i{display:block; width:100%; background:var(--line); border-radius:2px 2px 0 0}
  .cb.insel i{background:var(--accent)}
  .cb.today i{background:var(--down)}
  .cb.insel .lbl{color:var(--ink); font-weight:600}
  .cb .lbl{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden}
  .cb:hover::after{content:attr(data-tip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--card); font-size:12px; padding:2px 7px; border-radius:4px; white-space:nowrap; z-index:5}

  table{width:100%; border-collapse:collapse}
  th{font-size:12px; color:var(--muted); font-weight:500; text-align:right; padding:3px 6px; border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:4px 6px; text-align:right; border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  td.pos{color:var(--up); font-weight:600} td.neg{color:var(--down); font-weight:600}

  .loaderr{background:var(--down-bg,#F6F1F0); color:var(--down); border:1px solid var(--down);
    border-radius:6px; padding:8px 12px; margin-bottom:10px; font-size:12px; font-weight:600}
  .signals{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
  .chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); border-radius:20px; padding:5px 12px; font-size:12px}
  .chip .dot{width:6px; height:6px; border-radius:50%; background:var(--muted); flex:none}
  .chip.alert{color:var(--down); font-weight:600}
  .chip.alert .dot{background:var(--down)}
  .li.exp{cursor:pointer} .li.exp:hover{background:var(--hover)}
  .list{display:flex; flex-direction:column}
  
  /* массовая инкассация */
  .bulk{max-height:50vh; overflow:auto; margin-top:6px}
  .brow{display:grid; grid-template-columns:1fr 92px 104px 84px; gap:8px; align-items:center; padding:4px 0; border-top:1px solid var(--line)}
  .brow:first-child{border-top:0}
  .brow .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .brow input{padding:4px 7px}
  .brow .df{font-size:12px; text-align:right}
  .brow .df.up{color:var(--up)} .brow .df.down{color:var(--down)}
  .modal.wide{max-width:620px}
  .li{display:flex; gap:9px; align-items:baseline; padding:6px 2px; border-top:1px solid var(--line)}
  .li:first-child{border-top:0}
  .li .d{color:var(--muted); font-size:12px; flex:none; width:42px}
  .li .t{flex:1; min-width:0}
  .li .t .sub{color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .li .a{font-weight:600; white-space:nowrap}
  .li.bill .a{color:var(--down)}
  .filelink{color:var(--accent); text-decoration:none; margin-left:6px}
  .filelink:hover{text-decoration:underline}
  .nofile{color:var(--muted); margin-left:6px}
  .payrow{display:flex; gap:5px; align-items:center; flex:none}
  .empty-line{color:var(--muted); padding:12px 2px}
  .badge{font-size:12px; font-weight:600; border-radius:4px; padding:2px 7px; white-space:nowrap;
    border:1px solid var(--line); background:var(--card)}
  .badge.up{color:var(--up)}
  .badge.down{color:var(--down)}
  .badge.zero{color:var(--muted)}
  .warnmark{font-size:11px; color:var(--warn,#8A6A2B); border:1px solid var(--line);
    border-radius:4px; padding:1px 6px; margin-left:6px; cursor:help}
  .clip{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:4px;
    padding:1px 5px; text-decoration:none; white-space:nowrap}
  a.clip:hover{color:var(--accent); border-color:var(--accent)}
  .del{border:0; background:none; color:var(--muted); font-size:16px; line-height:1; padding:0 2px; flex:none}
  .del:hover{color:var(--down)}
  .btn.sm{padding:3px 9px; font-size:12px}
  details.nh{margin-top:8px; border-top:1px solid var(--line); padding-top:8px}
  details.nh summary{cursor:pointer; color:var(--down); font-weight:600; list-style:none}
  details.nh.paid summary{color:var(--muted)}
  details.nh summary::-webkit-details-marker{display:none}
  details.nh summary::before{content:"▸ "}
  details.nh[open] summary::before{content:"▾ "}
  .nhlist{margin-top:6px}
  .nhday{font-size:12px; color:var(--muted); font-weight:600; padding:7px 0 2px; position:sticky; top:0; background:var(--card)}
  .nhrow{display:flex; gap:9px; align-items:center; padding:3px 0}
  .nhrow .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* модальные окна */
  .mback{position:fixed; inset:0; background:rgba(15,17,20,.45); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 14px}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:8px;
    width:100%; max-width:460px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .modal h3{font-size:14px; margin-bottom:10px; display:flex}
  .modal h3 .x{margin-left:auto; border:0; background:none; color:var(--muted); font-size:18px; line-height:1; padding:0 2px}
  .form{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .form .widef{grid-column:1/-1}
  .form label{display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted)}
  .form label>*{width:100%}
  .hint{grid-column:1/-1; font-size:12px; color:var(--muted); background:var(--hover); border-radius:6px; padding:6px 9px}
  .hint b.pos{color:var(--up)} .hint b.neg{color:var(--down)}
  .msg{font-size:12px; margin-left:8px}
  .msg.ok{color:var(--up)} .msg.err{color:var(--down)}
  .foot{margin-top:8px; color:var(--muted); font-size:12px}
  .empty{padding:40px 20px; text-align:center; color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="empty">Загрузка данных…</div></div>
<script src="https://work.anyq.chat/grist-plugin-api.js"></script>
<script>
"use strict";
const CH=[
 {k:"cash",n:"Наличные"},{k:"kaspi",n:"Kaspi"},
 {k:"halyk",n:"Halyk"},{k:"bck",n:"БЦК"},
 {k:"deliv",n:"Доставка"},{k:"other",n:"Прочее"}];
const DELIV=["glovo","wolt","chocofood","yandex"];
// монохромная шкала (см. --chart1..8 в <style>): по убыванию доли, --chart8 —
// нейтрально-серый «хвост» для самых мелких долей
const CATC=["var(--chart1)","var(--chart2)","var(--chart3)","var(--chart4)","var(--chart5)","var(--chart6)","var(--chart7)","var(--chart8)"];
const TZ="Asia/Aqtobe";
const LAG_MS=2*60*60*1000;   // лаг синка: cutoff = время прогона − 2 ч
const fmt=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n);
// сумма расхода со знаком «−»: если сумма сама отрицательна (сторно/возврат),
// fmt() уже отдаёт "-1234" — нельзя приписывать перед ней ещё один минус,
// иначе получается "−-1234"
const fmtExp=n=>{n=n||0; return n<0?`+${fmt(-n)}`:`−${fmt(n)}`;};
const dayKey=d=>new Intl.DateTimeFormat("sv-SE",{timeZone:TZ}).format(d);
const RU_D=k=>new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"numeric",month:"long"}).format(new Date(k+"T12:00:00"));
const RU_DD=k=>new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"2-digit",month:"2-digit"}).format(new Date(k+"T12:00:00"));
const addDays=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return dayKey(d);};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const epoch=k=>Math.floor(Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))/1000);
const plural=(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;
  return a>10&&a<20?many:b>1&&b<5?few:b===1?one:many;};

let recs=[],deps={},depOrder=[],nameToId={},cats={},catOrder=[],accs={},accOrder=[];
let expenses=[],bills=[],cashrec=[];
let curExp=[];   // расходы за текущий период (без учёта поиска) — нужны поиску,
                 // чтобы фильтровать ленту без полной перерисовки страницы
let period="today",cFrom="",cTo="";
let sel=new Set(), selInit=false;   // выбранные точки; по умолчанию — все, галочки стоят
let openDD=false, modal=null, uiMsg="", fv={};
let tab="money", expQuery="", ptSort="sum";
let loadError="";   // сбой чтения данных: показываем явно, а не нулями
let docId="";       // нужен для ссылок на вложения через прокси сервиса       // вкладка (money | an) и поиск по расходам

const depId=v=>typeof v==="number"?v:(Array.isArray(v)?(+v[v.length-1]||0):(nameToId[String(v)]||0));
const depName=id=>deps[id]?.name||("#"+id);
const shortName=id=>depName(id);
const inSel=id=>sel.has(id);
const cols=t=>{const ks=Object.keys(t),n=t.id.length,out=[];
  for(let i=0;i<n;i++){const o={};ks.forEach(k=>o[k]=t[k][i]);out.push(o);}return out;};
const dstr=v=>v instanceof Date?dayKey(v):(typeof v==="number"?dayKey(new Date(v*1000)):String(v||""));

async function loadAll(){
  if(!docId){ try{ docId=(await grist.docApi.getDocName?.())||""; }catch(e){ docId=""; } }
  const [d,c,a,e,b,cr]=await Promise.all(
    ["Departments","ExpenseCategories","Accounts","Expenses","PayQueue","CashReconciliation"]
    .map(t=>grist.docApi.fetchTable(t)));
  deps={};depOrder=[];nameToId={};
  cols(d).forEach(r=>{deps[r.id]=r;nameToId[r.name]=r.id;if(r.is_sales)depOrder.push(r.id);});
  cats={};catOrder=[];
  cols(c).forEach(r=>{cats[r.id]=r;if(r.active!==false)catOrder.push(r.id);});
  accs={};accOrder=[];
  cols(a).forEach(r=>{accs[r.id]=r;accOrder.push(r.id);});
  expenses=cols(e).map(r=>({...r,dk:dstr(r.date)})).sort((x,y)=>y.dk.localeCompare(x.dk)||y.id-x.id);
  bills=cols(b).map(r=>({...r,dk:dstr(r.date_added)}));
  cashrec=cols(cr).map(r=>({...r,dk:dstr(r.date)})).sort((x,y)=>y.dk.localeCompare(x.dk)||y.id-x.id);
  if(!selInit&&depOrder.length){sel=new Set(depOrder);selInit=true;}
}

function range(){
  const t=dayKey(new Date());
  if(period==="today")return[t,t];
  if(period==="yest"){const y=addDays(t,-1);return[y,y];}
  if(period==="7d")return[addDays(t,-6),t];
  if(period==="month")return[t.slice(0,8)+"01",t];
  if(period==="custom"){const f=cFrom||t,to=cTo||t;return f<=to?[f,to]:[to,f];}
  // «Всё»: от первой строки выручки, а не от нулевого года — иначе диапазон
  // растягивался на сотни тысяч дней и график вешал вкладку
  let first=t;
  for(const r of recs){const k=dstr(r.date); if(k&&k<first)first=k;}
  return[first,t];
}
const PERIODS=[["today","Сегодня"],["yest","Вчера"],["7d","7 дней"],["month","Месяц"],["all","Всё"],["custom","Свой период"]];

function chanSums(rows){
  const s={cash:0,kaspi:0,halyk:0,bck:0,deliv:0,other:0,total:0};
  for(const r of rows){
    for(const c of ["cash","kaspi","halyk","bck","other"])s[c]+=r[c]||0;
    for(const c of DELIV)s.deliv+=r[c]||0;
    s.total+=r.total||0;}
  return s;
}

function donut(parts,size){
  const tot=parts.reduce((a,p)=>a+p.v,0);
  if(tot<=0)return"";
  const R=size/2-8,C=2*Math.PI*R;let off=C/4;
  const segs=parts.map(p=>{
    const len=p.v/tot*C;
    const s=`<circle r="${R}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${p.c}"
      stroke-width="15" stroke-dasharray="${Math.max(len-1,0.5).toFixed(2)} ${(C-len+1).toFixed(2)}"
      stroke-dashoffset="${off.toFixed(2)}"><title>${esc(p.label)}: ${fmt(p.v)} ₸ (${(p.v/tot*100).toFixed(1)}%)</title></circle>`;
    off-=len;return s;}).join("");
  return `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">${segs}</svg>`;
}
function legend(parts){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1;
  return `<div class="lg">`+parts.map(p=>`<div class="it"><span class="sq" style="background:${p.c}"></span>
    <span class="nm">${esc(p.label)}</span><span class="vv num">${fmt(p.v)}</span>
    <span class="pp num">${(p.v/tot*100).toFixed(0)}%</span></div>`).join("")+`</div>`;
}

function cashHint(dk,dep,amt){
  const expd=expectedCash(dk,dep);
  const act=parseFloat(amt);
  let h=`Ожидается за ${RU_DD(dk)}: <b class="num">${fmt(expd)} ₸</b>`;
  if(!isNaN(act)){
    const d=Math.round((act-expd)*100)/100;
    h+= d===0?`. <b class="pos">Сойдётся ровно</b>`
      : d>0?`. Излишек: <b class="pos">+${fmt(d)} ₸</b>`
           :`. Недосдача: <b class="neg">−${fmt(-d)} ₸</b>`;
  }
  return h;
}
// ожидаемая сдача, посчитанная на клиенте для подсказки в форме
function expectedCash(dk,dep){
  let cash=0;
  for(const r of recs){ if(dstr(r.date)===dk&&depId(r.department)===dep) cash+=r.cash||0; }
  let spent=0;
  for(const e of expenses){ if(e.dk===dk&&e.department===dep&&accs[e.account]?.name==="Касса точки") spent+=e.amount||0; }
  return Math.round((cash-spent)*100)/100;
}

      <span class="a num">${fmtExp(r.amount)}</span>

function render(){
  const app=document.getElementById("app");
  const [from,to]=range();
  const todayK=dayKey(new Date());
  const rvRows=recs.filter(r=>{const k=dstr(r.date);return k>=from&&k<=to&&inSel(depId(r.department));});
  const cur=chanSums(rvRows);
  const exp=expenses.filter(r=>r.dk>=from&&r.dk<=to&&inSel(r.department));
  const expSum=exp.reduce((a,r)=>a+(r.amount||0),0);
  const net=cur.total-expSum;

  const len=Math.round((new Date(to)-new Date(from))/864e5)+1;
  const pFrom=addDays(from,-len),pTo=addDays(from,-1);
  const prevRows=recs.filter(r=>{const k=dstr(r.date);return k>=pFrom&&k<=pTo&&inSel(depId(r.department));});
  const prev=chanSums(prevRows);
  // дельту не показываем, если период включает сегодня (день не закончен)
  // или в прошлом периоде нет данных за столько же дней
  const openDay=to>=todayK;
  const prevDays=new Set(prevRows.map(r=>dstr(r.date))).size;
  const lastSync=recs.map(r=>r.last_sync_upper||"").filter(Boolean).sort().pop()||"";
  const syncTime=lastSync?lastSync.slice(11,16):"";
  // last_sync_upper — это отсечка (время прогона минус лаг 2 ч), поэтому
  // сам прогон был на 2 часа позже. Если с тех пор прошло больше часа,
  // данные устарели: обмен с iiko встал, и об этом надо сказать явно.
  let syncAgeMin=null, syncRunAt="";
  if(lastSync){
    const cut=new Date(lastSync);
    if(!isNaN(cut)){
      const ranAt=new Date(cut.getTime()+LAG_MS);
      syncRunAt=new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(ranAt);
      syncAgeMin=Math.round((Date.now()-ranAt.getTime())/60000);
    }
  }
  const syncStale=syncAgeMin!==null&&syncAgeMin>60;
  let dHtml=`<span class="d mut">&nbsp;</span>`;
  if(openDay) dHtml=`<span class="d mut">день не закончен${syncTime?", данные до "+syncTime:""}</span>`;
  else if(period!=="all"&&prev.total>0&&prevDays>=len){
    const d=(cur.total-prev.total)/prev.total*100;
    dHtml=`<span class="d ${d>=0?"up":"down"}">${d>=0?"+":"−"}${Math.abs(d).toFixed(1)}% к ${RU_DD(pFrom)}${len>1?"-"+RU_DD(pTo):""}</span>`;}
  else if(period!=="all") dHtml=`<span class="d mut">не с чем сравнить</span>`;

  const pills=PERIODS.map(([k,n])=>`<button class="pill${period===k?" on":""}" data-p="${k}">${n}</button>`).join("");
  const custom=period==="custom"?`<span class="range">с
      <input type="date" id="c-from" value="${cFrom||from}"> по
      <input type="date" id="c-to" value="${cTo||to}"></span>`:"";
  const depLabel=sel.size===depOrder.length?"Точки: все"
    :sel.size===0?"Точки: ни одной"
    :sel.size===1?depName([...sel][0]):`Точки: ${sel.size} из ${depOrder.length}`;
  const menu=`<div class="menu">
    <input type="search" id="depsearch" placeholder="Поиск точки" style="width:100%;margin-bottom:6px">
    <div class="tools"><button data-selall>Выбрать все</button><button data-selnone>Сбросить</button></div>
    <div class="tools">`+[...new Set(depOrder.map(id=>deps[id]?.city).filter(Boolean))]
      .map(c=>`<button data-city="${esc(c)}">${esc(c)}</button>`).join("")+`</div>`+
    depOrder.map(id=>`<label data-nm="${esc(depName(id).toLowerCase())}"><input type="checkbox" data-dep="${id}"${sel.has(id)?" checked":""}>${esc(depName(id))}</label>`).join("")+`</div>`;

  // сданная наличность за период: уходит из кассы точки
  const handedSum=cashrec.filter(r=>r.dk>=from&&r.dk<=to&&inSel(r.department))
    .reduce((s,r)=>s+(r.cash_actual||0),0);
  const accCalc=id=>{
    const a=accs[id];if(!a)return null;
    const chans=(a.revenue_cols||"").split(",").map(s=>s.trim()).filter(Boolean);
    let inflow=0,viaAgg=0;
    for(const r of rvRows)for(const c of chans){
      inflow+=r[c]||0; if(DELIV.includes(c))viaAgg+=r[c]||0;}
    let out=exp.filter(e=>e.account===id).reduce((s,e)=>s+(e.amount||0),0);
    let note="";
    if(a.name==="Касса точки"&&handedSum){out+=handedSum;note=`в т.ч. сдано ${fmt(handedSum)}`;}
    if(viaAgg)note=(note?note+", ":"")+`агрегаторы ${fmt(viaAgg)} придут позже`;
    return {name:a.name,inflow,out,net:inflow-out,note};};
  const cfCalc=accOrder.map(accCalc).filter(x=>x&&(x.inflow||x.out));
  const cfNet=cfCalc.reduce((s,x)=>s+x.net,0);
  const cfRows=cfCalc.map(x=>`<tr><td>${esc(x.name)}${x.note?`<div class="sub">${esc(x.note)}</div>`:""}</td>
      <td class="num">${fmt(x.inflow)}</td><td class="num">${x.out?"−"+fmt(x.out):"0"}</td>
      <td class="num ${x.net>=0?"pos":"neg"}">${fmt(x.net)}</td></tr>`).join("")
    ||`<tr><td colspan="4" class="empty-line" style="text-align:left">Нет движения за период.</td></tr>`;

  // доля расходов в выручке: понятная величина. Обратное отношение
  // (во сколько выручка покрывает расходы) при копеечных расходах
  // давало абсурд вида «покрытие 26483%».
  // чеки приходят из iiko отдельным запросом, средний чек считаем по сумме
  const checksCnt=rvRows.reduce((s,r)=>s+(r.checks||0),0);
  const share=cur.total>0&&expSum>0?expSum/cur.total*100:null;
  const lastExp=expenses.length?expenses[0].dk:"";
  // «чистый доход» честен только когда расходы за период вообще вносили
  const netKnown=exp.length>0;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="t">Выручка</div><div class="v num">${fmt(cur.total)} ₸</div>${dHtml}</div>
    <div class="kpi"><div class="t">Расходы</div><div class="v num">${fmt(expSum)} ₸</div>
      <span class="d mut">${exp.length} ${plural(exp.length,"запись","записи","записей")}${share!==null?`, ${share<0.1?"<0,1":share.toFixed(1).replace(".",",")}% от выручки`:""}</span></div>
    <div class="kpi"><div class="t">Чистый доход</div>
      <div class="v num ${netKnown?(net>=0?"pos":"neg"):""}"${netKnown?"":' style="color:var(--muted)"'}>${fmt(net)} ₸</div>
      ${netKnown?(net>=0?`<span class="d up">в плюсе</span>`:`<span class="d down">до нуля не хватает ${fmt(-net)} ₸</span>`)
        :`<span class="d down">расходы не внесены${lastExp?", последний "+RU_DD(lastExp):""}</span>`}</div>
    <div class="kpi"><div class="t">Средний чек</div>
      <div class="v num">${checksCnt?fmt(cur.total/checksCnt):"—"} ₸</div>
      <span class="d mut">${checksCnt?fmt(checksCnt)+" "+plural(checksCnt,"чек","чека","чеков"):"нет данных о чеках"}</span></div>
    <div class="kpi"><div class="t">Оборот по счетам</div><div class="v num">${fmt(cfNet)} ₸</div>
      <span class="d mut">приход минус расход</span></div>
  </div>`;

  // цвет по рангу доли (как у catParts ниже) — согласованная монохромная шкала на обоих донатах
  const chParts=CH.filter(c=>cur[c.k]>0).map(c=>({v:cur[c.k],label:c.n}))
    .sort((a,b)=>b.v-a.v).map((p,i)=>({...p,c:CATC[i%CATC.length]}));
  const byCat={};
  exp.forEach(r=>{byCat[r.category]=(byCat[r.category]||0)+(r.amount||0);});
  // сторно (отрицательная сумма) ломает сегмент круговой диаграммы —
  // в круг идут только положительные статьи, минусовые видны в ленте
  const catParts=Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([id,v],i)=>({v,c:CATC[i%CATC.length],label:cats[id]?.name||"—"}));

  const byDep={},byDepPrev={};
  rvRows.forEach(r=>{const id=depId(r.department);byDep[id]=(byDep[id]||0)+(r.total||0);});
  prevRows.forEach(r=>{const id=depId(r.department);byDepPrev[id]=(byDepPrev[id]||0)+(r.total||0);});
  // чеки по точкам за период: даёт средний чек рядом с объёмом выручки
  const byDepChecks={};
  rvRows.forEach(r=>{const id=depId(r.department);byDepChecks[id]=(byDepChecks[id]||0)+(r.checks||0);});
  const pts=depOrder.filter(inSel).map(id=>({id,v:byDep[id]||0,p:byDepPrev[id]||0,
    ch:byDepChecks[id]||0})).sort((a,b)=>ptSort==="avg"?(b.v/(b.ch||1))-(a.v/(a.ch||1)):b.v-a.v);
  const maxV=Math.max(...pts.map(p=>p.v),1);
  const showDelta=!openDay&&period!=="all"&&prevDays>=len;
  const anyChecks=pts.some(p=>p.ch>0);
  const ptRows=pts.map(p=>{
    let dl="";
    if(showDelta&&p.p>0){const d=(p.v-p.p)/p.p*100;
      dl=`<span class="pdelta ${d>=0?"up":"down"}">${d>=0?"+":"−"}${Math.abs(d).toFixed(0)}%</span>`;}
    const avg=p.ch?`<span class="avgchk num" title="${fmt(p.ch)} ${plural(p.ch,"чек","чека","чеков")}">${fmt(p.v/p.ch)}</span>`
                  :`<span class="avgchk"></span>`;
    const only=sel.size===1&&sel.has(p.id);
    return `<div class="row${p.v===0?" zero":""}${only?" only":""}" data-point="${p.id}"
      title="${only?"Показать все точки":"Показать только эту точку"}">
    <span class="name">${esc(shortName(p.id))}</span>
    <span class="track"><i style="width:${(p.v/maxV*100).toFixed(1)}%"></i></span>
    <span class="val num">${p.v===0?"0":fmt(p.v)}</span>${anyChecks?avg:""}${dl||`<span class="pdelta"></span>`}</div>`;}).join("")
    ||`<div class="empty-line">Нет данных за период.</div>`;

  // график всегда показывает контекст последних дней; выбранный период подсвечен
  const byDay={};
  recs.filter(r=>inSel(depId(r.department))).forEach(r=>{const k=dstr(r.date);byDay[k]=(byDay[k]||0)+(r.total||0);});
  const span=Math.min(Math.max(len,14),60);   // не больше 60 столбцов
  const dks=[];
  for(let k=addDays(to,-(span-1));k<=to;k=addDays(k,1))dks.push(k);
  const dmax=Math.max(...dks.map(k=>byDay[k]||0),1);
  const chart=dks.map(k=>{
    const v=byDay[k]||0,h=Math.max(Math.round(v/dmax*86),2);
    const cls=(k===todayK?" today":"")+(k>=from&&k<=to?" insel":"");
    return `<div class="cb${cls}" data-tip="${RU_D(k)}: ${fmt(v)} ₸">
      <i style="height:${h}px"></i><span class="lbl">${+k.slice(8)}</span></div>`;}).join("");


  // сверка касс: записи за период (по дате сдачи) + бейдж
  // сдачи не привязаны к выбранному периоду: их вносят за прошлые дни
  const crAll=cashrec.filter(r=>inSel(r.department));
  const crs=crAll.slice(0,20);
  const crList=crs.map(r=>{
    const d=r.diff||0;
    const badge=d===0?`<span class="badge zero">сошлось</span>`
      :d>0?`<span class="badge up">излишек +${fmt(d)}</span>`
           :`<span class="badge down">недосдача −${fmt(-d)}</span>`;
    const moved=r.data_changed?` <span class="warnmark" title="После сдачи в этот день внесли расходы или обновилась выручка. Разница считается по снимку на момент сдачи (${fmt(r.expected_at_submit||0)}).">данные менялись</span>`:"";
    return `<div class="li"><span class="d num">${RU_DD(r.dk)}</span>
      <span class="t"><b>${esc(shortName(r.department))}</b>${moved}
        <div class="sub">ожидалось ${fmt(r.expected_at_submit||r.cash_expected||0)}, сдано ${fmt(r.cash_actual||0)}${r.note?", "+esc(r.note):""}</div></span>
      ${badge}<button class="del" data-delcr="${r.id}" title="Удалить запись">×</button></div>`;}).join("")
    ||`<div class="empty-line">Сдач ещё не вносили. Раскройте список ниже и нажмите «Внести».</div>`;
  // несданная касса за ВСЕ закрытые дни (сегодня не считаем, день идёт)
  const cashByDay={};   // day -> {depId: cash}
  recs.forEach(r=>{
    const k=dstr(r.date); if(k>=todayK)return;
    const id=depId(r.department); const c=r.cash||0; if(c<=0)return;
    (cashByDay[k]||={})[id]=(cashByDay[k][id]||0)+c;});
  const handedSet=new Set(cashrec.map(r=>r.dk+"|"+r.department));
  const debtDays=[];
  let debtSum=0,debtCount=0;
  Object.keys(cashByDay).sort().reverse().forEach(k=>{
    const list=Object.entries(cashByDay[k])
      .filter(([id])=>!handedSet.has(k+"|"+id)&&inSel(+id))
      .map(([id,v])=>({id:+id,v})).sort((a,b)=>b.v-a.v);
    if(!list.length)return;
    const s=list.reduce((a,x)=>a+x.v,0);
    debtSum+=s; debtCount+=list.length;
    debtDays.push({k,list,s});});
  const shown=debtDays.slice(0,10);
  const nhLine=debtDays.length?`<details class="nh"><summary>Не сдана касса за ${debtDays.length} ${plural(debtDays.length,"день","дня","дней")}: ${fmt(debtSum)} ₸</summary>
    <div class="nhlist">`+shown.map(d=>`<div class="nhday">${RU_D(d.k)}: ${d.list.length} ${plural(d.list.length,"точка","точки","точек")}, ${fmt(d.s)} ₸</div>`+
      d.list.map(x=>`<div class="nhrow"><span class="nm">${esc(shortName(x.id))}</span>
        <span class="num">${fmt(x.v)}</span>
        <button class="btn ghost sm" data-hand="${x.id}" data-day="${d.k}">Внести</button></div>`).join("")).join("")+
      (debtDays.length>shown.length?`<div class="nhday">и ещё ${debtDays.length-shown.length} ${plural(debtDays.length-shown.length,"день","дня","дней")}</div>`:``)+
    `</div></details>`:"";

  const unpaid=bills.filter(r=>!r.paid&&inSel(r.department)).sort((a,b)=>a.dk.localeCompare(b.dk));
  const accSel=id=>`<select data-accfor="${id}" title="Счёт списания">${accOrder.filter(a=>accs[a].name!=="Касса точки")
    .map(a=>`<option value="${a}">${esc(accs[a].name)}</option>`).join("")}</select>`;
  // статья расхода для оплаты счёта: закупочная по умолчанию, казначей может сменить
  const defCat=catOrder.find(c=>/продукт/i.test(cats[c].name))||catOrder[0];
  const catSel=(id,cur)=>`<select data-catfor="${id}" title="Статья расхода">${catOrder
    .map(c=>`<option value="${c}"${(cur||defCat)===c?" selected":""}>${esc(cats[c].name)}</option>`).join("")}</select>`;
  const billList=unpaid.map(r=>`<div class="li bill">
    <span class="d num">${r.dk?RU_DD(r.dk):""}</span>
    <span class="t"><b>${esc(r.supplier||"Поставщик")}</b>
      <div class="sub">${esc(shortName(r.department))}${r.request_no?", заявка "+esc(r.request_no):""}
        ${r.invoice_link?`<a href="${esc(r.invoice_link)}" target="_blank" rel="noopener" class="filelink">открыть счёт</a>`:`<span class="nofile">без файла</span>`}</div></span>
    <span class="a num">${fmt(r.amount||0)}</span>
    <span class="payrow">${catSel(r.id,r.category)}${accSel(r.id)}<button class="btn primary" data-pay="${r.id}">Оплачено</button></span></div>`).join("")
    ||`<div class="empty-line">Неоплаченных счетов нет.</div>`;

  // лента расходов: поиск, группировка по дням, клик по строке правит.
  // curExp запоминаем для лёгкого поиска (см. buildExpList) без полной перерисовки.
  curExp=exp;
  const expList=buildExpList();

  // строка сигналов: что требует действия прямо сейчас
  const zeroPts=pts.filter(p=>p.v===0).length;
  const chip=(on,txt,target)=>`<button class="chip${on?" alert":""}" data-goto="${target}"><span class="dot"></span>${txt}</button>`;
  const signals=`<div class="signals">
    ${chip(debtDays.length>0,`Касса не сдана: ${debtDays.length?fmt(debtSum)+" ₸":"нет"}`,"c-cash")}
    ${chip(unpaid.length>0,`Счета к оплате: ${unpaid.length?unpaid.length+" на "+fmt(unpaid.reduce((a,r)=>a+(r.amount||0),0))+" ₸":"нет"}`,"c-bills")}
    ${chip(zeroPts>0,`Точки без продаж: ${zeroPts||"нет"}`,"c-points")}
    ${chip(syncStale,syncAgeMin===null?"Синк iiko: нет данных"
      :syncStale?`Обмен с iiko отстал: ${syncRunAt}, ${Math.floor(syncAgeMin/60)} ч назад`
                :`Обновлено в ${syncRunAt}`,"c-chart")}
  </div>`;

  const cardPoints=`<div class="card" id="c-points"><h2>Точки
        <span class="pills sortpills"><button class="pill${ptSort==="sum"?" on":""}" data-sort="sum">по выручке</button><button class="pill${ptSort==="avg"?" on":""}" data-sort="avg">по чеку</button></span>
        <span class="cnt">${pts.filter(p=>p.v>0).length} из ${pts.length} с продажами</span></h2>
        <div class="rows">${ptRows}</div></div>`;
  const cardCash=`<div class="card" id="c-cash"><h2>Сверка касс <span class="sub">последние сдачи</span><span class="cnt">${crAll.length?`всего ${crAll.length}`:""}</span></h2>
        <div class="list">${crList}</div>${nhLine}</div>`;
  // недавно оплаченные: ошибиться легко, отменить надо в один клик
  const paidBills=bills.filter(r=>r.paid&&inSel(r.department))
    .sort((a,b)=>String(dstr(b.paid_date)).localeCompare(String(dstr(a.paid_date)))).slice(0,10);
  const paidList=paidBills.map(r=>`<div class="li">
    <span class="d num">${r.paid_date?RU_DD(dstr(r.paid_date)):""}</span>
    <span class="t"><b>${esc(r.supplier||"Поставщик")}</b>
      <div class="sub">${esc(shortName(r.department))}${accs[r.paid_account]?", "+esc(accs[r.paid_account].name):""}</div></span>
    <span class="a num">${fmt(r.amount||0)}</span>
    <button class="btn sm" data-unpay="${r.id}">Отменить оплату</button></div>`).join("");
  const paidBlock=paidBills.length?`<details class="nh paid"><summary>Оплаченные: ${paidBills.length}${paidBills.length===10?"+":""}, ${fmt(paidBills.reduce((a,r)=>a+(r.amount||0),0))} ₸</summary>
    <div class="nhlist">${paidList}</div></details>`:"";
  const cardBills=`<div class="card" id="c-bills"><h2>Счета к оплате<span class="cnt">${unpaid.length} шт, ${fmt(unpaid.reduce((a,r)=>a+(r.amount||0),0))} ₸</span></h2>
        <div class="list">${billList}</div>${paidBlock}</div>`;
  const cardExp=`<div class="card wide" id="c-exp"><h2>Расходы <span class="sub">за период</span>
        <input type="search" id="expsearch" placeholder="Поиск" value="${esc(expQuery||"")}" style="margin-left:auto;max-width:180px">
        <span class="cnt">${exp.length} шт, ${fmtExp(expSum)} ₸</span></h2>
        <div class="list tall" id="explist">${expList}</div></div>`;
  const cardChart=`<div class="card" id="c-chart"><h2>Динамика по дням <span class="sub">₸, красный столбец: сегодня</span></h2>
        <div class="chart">${chart}</div></div>`;
  // прибыль по точкам: выручка минус расходы, отнесённые на точку
  const byDepExp={};
  exp.forEach(r=>{byDepExp[r.department]=(byDepExp[r.department]||0)+(r.amount||0);});
  const profitRows=depOrder.filter(inSel)
    .map(id=>({id,rev:byDep[id]||0,ex:byDepExp[id]||0}))
    .filter(p=>p.rev||p.ex)
    .map(p=>({...p,net:p.rev-p.ex}))
    .sort((a,b)=>b.net-a.net);
  const profitTable=profitRows.length?`<table>
      <tr><th>Точка</th><th>Выручка</th><th>Расходы</th><th>Чистый доход</th></tr>
      ${profitRows.map(p=>`<tr><td>${esc(shortName(p.id))}</td>
        <td class="num">${fmt(p.rev)}</td>
        <td class="num">${p.ex?"−"+fmt(p.ex):"0"}</td>
        <td class="num ${p.net>=0?"pos":"neg"}">${fmt(p.net)}</td></tr>`).join("")}
      <tr><td><b>Итого</b></td><td class="num"><b>${fmt(profitRows.reduce((s,p)=>s+p.rev,0))}</b></td>
        <td class="num"><b>${fmt(profitRows.reduce((s,p)=>s+p.ex,0))?"−"+fmt(profitRows.reduce((s,p)=>s+p.ex,0)):"0"}</b></td>
        <td class="num"><b>${fmt(profitRows.reduce((s,p)=>s+p.net,0))}</b></td></tr>
    </table>`:`<div class="empty-line">Нет данных за период.</div>`;
  const cardProfit=`<div class="card wide" id="c-profit"><h2>Прибыль по точкам
        <span class="sub">${netKnown?"выручка минус внесённые расходы":"расходы за период не вносили"}</span></h2>
        ${profitTable}</div>`;

  const cardCF=`<div class="card"><h2>Движение по счетам <span class="sub">оборот за период, не остаток</span></h2>
        <table><tr><th>Счёт</th><th>Приход</th><th>Расход</th><th>Оборот</th></tr>${cfRows}</table></div>`;
  const cardDonutRev=`<div class="card"><h2>Выручка по каналам <span class="cnt">${from===to?RU_D(from):RU_DD(from)+"-"+RU_DD(to)}</span></h2>
        ${chParts.length?`<div class="split">${donut(chParts,150)}${legend(chParts)}</div>`:`<div class="empty-line">Продаж нет.</div>`}</div>`;
  const cardDonutExp=`<div class="card"><h2>Расходы по статьям <span class="cnt">${fmtExp(expSum)} ₸</span></h2>
        ${catParts.length?`<div class="split">${donut(catParts,150)}${legend(catParts)}</div>`:`<div class="empty-line">Расходов за период нет.</div>`}</div>`;

  const body=tab==="money"
    ? `<div class="grid">${cardPoints}${cardCash}${cardBills}${cardExp}</div>`
    : `<div class="grid">${cardChart}${cardCF}${cardProfit}${cardDonutRev}${cardDonutExp}</div>`;

  const errBanner=loadError?`<div class="loaderr">Не удалось прочитать данные из Grist: ${esc(loadError)}.
    Показанные цифры могут быть неполными. Обновите страницу; если не помогает, проверьте доступ виджета к документу.</div>`:"";
  app.innerHTML=`
    ${errBanner}
    <div class="toolbar">
      <div class="tb-filters">
        <div class="pills tabs">
          <button class="pill${tab==="money"?" on":""}" data-tab="money">Касса</button>
          <button class="pill${tab==="an"?" on":""}" data-tab="an">Аналитика</button>
        </div>
        <div class="pills">${pills}</div>${custom}
        <details class="dd" id="depdd"${openDD?" open":""}><summary>${esc(depLabel)}</summary>${menu}</details>
      </div>
      <div class="tb-actions">
        <button class="btn primary" id="btn-exp">+ Расход</button>
        <button class="btn ghost" id="btn-cash">Инкассация</button>
      </div>
    </div>
    ${signals}
    ${kpis}
    ${body}
    ${modalHtml()}`;
  wire();
}

// ВАЖНО: id и служебные поля обязаны переживать пересборку формы,
// иначе правка записи превращается в создание новой (дубли).
// Файл прикрепляется через прокси сервиса виджетов: Grist 1.7.18 не выдаёт
// виджету токен для прямой загрузки, а ключ в браузер класть нельзя.
async function uploadFile(file, docId){
  if(/github\.io$/.test(location.hostname))throw new Error("виджет открыт не с сервера AnyQ");
  const fd=new FormData(); fd.append("upload",file,file.name);
  const res=await fetch(`/upload?doc=${encodeURIComponent(docId||"")}`,{method:"POST",body:fd});
  if(!res.ok)throw new Error("сервер ответил "+res.status);
  const ids=await res.json();
  return Array.isArray(ids)?ids:[ids];
}

const grabForm=()=>{const g=id=>document.getElementById(id);
  return {id:fv.id, vals:fv.vals,
          date:g("f-date")?.value,dep:g("f-dep")?.value,cat:g("f-cat")?.value,
          acc:g("f-acc")?.value,amt:g("f-amt")?.value,sup:g("f-sup")?.value,note:g("f-note")?.value};};

// правка/удаление строки ленты расходов — отдельной функцией, потому что
// поиск (см. wire()) перестраивает только #explist и должен перепривязать
// именно эти обработчики, не трогая остальную страницу
function wireExpList(){
  document.querySelectorAll("[data-editexp]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-delexp]"))return;
    const r=expenses.find(x=>x.id===+el.dataset.editexp); if(!r)return;
    modal="exp";uiMsg="";
    fv={id:r.id,date:r.dk,dep:r.department,cat:r.category,acc:r.account,
        amt:r.amount,sup:r.supplier||"",note:r.note||""};
    render();});
  document.querySelectorAll("[data-delexp]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const r=expenses.find(x=>x.id===+b.dataset.delexp); if(!r)return;
    modal="delexp";uiMsg="";
    fv={id:r.id,label:`${RU_DD(r.dk)}, ${cats[r.category]?.name||"—"}, ${fmt(r.amount||0)} ₸`};
    render();});
}

function wire(){
 try{
  document.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{period=b.dataset.p;uiMsg="";render();});
  const cf=document.getElementById("c-from"),ct=document.getElementById("c-to");
  if(cf)cf.onchange=e=>{cFrom=e.target.value;render();};
  if(ct)ct.onchange=e=>{cTo=e.target.value;render();};
  // #depdd рендерится всегда безусловно, но на всякий случай — как и остальные
  // элементы ниже — привязываем защищённо, чтобы правка разметки в будущем
  // не оборвала привязку всех последующих обработчиков (как уже было однажды)
  const dd=document.getElementById("depdd");
  if(dd){
   dd.addEventListener("toggle",()=>{openDD=dd.open;});
   // живое применение: перерисовка сразу, дропдаун остаётся открытым,
   // поиск и прокрутка списка сохраняются
   const rerenderKeepDD=()=>{
    const q=document.getElementById("depsearch")?.value||"";
    const st=dd.querySelector(".menu")?.scrollTop||0;
    render();
    const dd2=document.getElementById("depdd");
    const ds2=document.getElementById("depsearch");
    if(ds2&&q){ds2.value=q;ds2.dispatchEvent(new Event("input"));}
    const m2=dd2?.querySelector(".menu"); if(m2)m2.scrollTop=st;
   };
   dd.querySelectorAll("[data-dep]").forEach(cb=>cb.onchange=()=>{
    const id=+cb.dataset.dep;cb.checked?sel.add(id):sel.delete(id);
    rerenderKeepDD();});
   const on=(sel_,fn)=>{const el=dd.querySelector(sel_); if(el)el.onclick=fn;};
   on("[data-selall]",()=>{sel=new Set(depOrder);rerenderKeepDD();});
   on("[data-selnone]",()=>{sel.clear();rerenderKeepDD();});
   dd.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{
    sel=new Set(depOrder.filter(id=>deps[id]?.city===b.dataset.city));rerenderKeepDD();});
   const ds=document.getElementById("depsearch");
   if(ds)ds.oninput=()=>{
    const q=ds.value.trim().toLowerCase();
    dd.querySelectorAll("label[data-nm]").forEach(l=>{
      l.style.display=!q||l.dataset.nm.includes(q)?"":"none";});};
  }
  // элементы могут отсутствовать (модалка, другая вкладка) — привязываем безопасно
  const bind=(id,fn)=>{const el=document.getElementById(id); if(el)el.onclick=fn;};
  bind("btn-exp",()=>{modal="exp";fv={};uiMsg="";render();});
  bind("btn-cash",()=>{modal="bulk";fv={vals:{}};uiMsg="";render();});
  document.querySelectorAll(".pills.tabs .pill").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{ptSort=b.dataset.sort;render();});
  document.querySelectorAll("[data-point]").forEach(el=>el.onclick=()=>{
    const id=+el.dataset.point;
    // клик по точке — быстрый фильтр на неё одну, повторный клик возвращает все
    sel = (sel.size===1&&sel.has(id)) ? new Set(depOrder) : new Set([id]);
    render();});
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{
    if(tab!=="money"&&["c-chart"].includes(b.dataset.goto)===false){tab="money";render();}
    else if(b.dataset.goto==="c-chart"&&tab!=="an"){tab="an";render();}
    setTimeout(()=>document.getElementById(b.dataset.goto)?.scrollIntoView({behavior:"smooth",block:"start"}),30);});
  const es=document.getElementById("expsearch");
  if(es)es.oninput=()=>{expQuery=es.value;
    // точечное обновление ленты расходов вместо полной перерисовки страницы —
    // иначе каждый введённый символ дёргал тяжёлый render() целиком
    const list=document.getElementById("explist");
    if(list){list.innerHTML=buildExpList();wireExpList();}
    else render();};

  // модалка: закрытие по фону/крестику, живой пересчёт подсказки сдачи
  document.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click",e=>{
    if(e.target===el||el.tagName==="BUTTON"){modal=null;uiMsg="";render();}}));
  if(modal==="cash"){
    // ввод обновляет только строку подсказки, без перерисовки страницы
    const upd=()=>{fv=grabForm();
      const h=document.getElementById("cash-hint");
      if(h)h.innerHTML=cashHint(fv.date||addDays(dayKey(new Date()),-1),+fv.dep,fv.amt);};
    ["f-date","f-dep","f-amt"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("input",upd);});
    const cashBtn=document.getElementById("f-cash");
    if(cashBtn)cashBtn.onclick=async()=>{
      fv=grabForm();
      const amt=parseFloat(fv.amt);
      if(isNaN(amt)||amt<0){uiMsg="Ошибка: введите сумму";render();return;}
      cashBtn.disabled=true;
      const dk=fv.date,dep=+fv.dep;
      // одна сдача на точку и день: если запись есть, обновляем её
      const ex=cashrec.find(r=>r.dk===dk&&r.department===dep);
      const flds={date:epoch(dk),department:dep,cash_actual:amt,
        expected_at_submit:expectedCash(dk,dep),
        note:(fv.note||"").trim(),submitted_by:"дашборд"};
      try{
        await grist.docApi.applyUserActions([ ex
          ? ["UpdateRecord","CashReconciliation",ex.id,flds]
          : ["AddRecord","CashReconciliation",null,flds] ]);
        modal=null;uiMsg="";await loadAll();render();
      }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}
    };
  }
  if(modal==="exp"){
    const addBtn=document.getElementById("f-add");
    if(addBtn)addBtn.onclick=async()=>{
      fv=grabForm();
      const amt=parseFloat(fv.amt);
      if(!amt||amt<=0){uiMsg="Ошибка: введите сумму";render();return;}
      addBtn.disabled=true;
      try{
        const dk=fv.date||dayKey(new Date());
        const flds={date:epoch(dk),department:+fv.dep,category:+fv.cat,amount:amt,
          account:+fv.acc,period:dk.slice(0,7),
          supplier:(fv.sup||"").trim(),note:(fv.note||"").trim()};
        // файл не должен мешать записи расхода: не загрузился — говорим прямо
        let fileNote="";
        const fi=document.getElementById("f-file");
        const file=fi&&fi.files&&fi.files[0];
        if(file){
          try{
            const ids=await uploadFile(file,docId);
            if(ids&&ids.length)flds.attachment=["L",...ids];
          }catch(e){ fileNote=" Файл не прикрепился ("+(e.message||e)+")."; }
        }
        await grist.docApi.applyUserActions([ fv.id
          ? ["UpdateRecord","Expenses",fv.id,flds]
          : ["AddRecord","Expenses",null,{...flds,source:"казначей",created_by:"дашборд"}] ]);
        await loadAll();
        if(fileNote){uiMsg="Расход сохранён."+fileNote;}
        else{modal=null;uiMsg="";}
        render();
      }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}
    };
  }
  if(modal==="bulk"){
    const df=document.getElementById("f-date");
    if(df)df.onchange=()=>{fv={date:df.value,vals:{}};render();};
    document.querySelectorAll("[data-bulk]").forEach(inp=>inp.oninput=()=>{
      fv.vals=fv.vals||{};fv.vals[+inp.dataset.bulk]=inp.value;
      const row=inp.closest(".brow"),cell=row.querySelector(".df");
      const expd=expectedCash(fv.date||addDays(dayKey(new Date()),-1),+inp.dataset.bulk);
      const a=parseFloat(inp.value);
      if(isNaN(a)){cell.textContent="";cell.className="df";}
      else{const d=Math.round((a-expd)*100)/100;
        cell.textContent=d===0?"ровно":(d>0?"+":"−")+fmt(Math.abs(d));
        cell.className="df "+(d>0?"up":d<0?"down":"");}});
    const bulkBtn=document.getElementById("f-bulk");
    if(bulkBtn)bulkBtn.onclick=async()=>{
      const dk=(document.getElementById("f-date")||{}).value||addDays(dayKey(new Date()),-1);
      const acts=[];
      document.querySelectorAll("[data-bulk]").forEach(inp=>{
        const v=parseFloat(inp.value); if(isNaN(v)||v<0)return;
        const dep=+inp.dataset.bulk;
        const ex=cashrec.find(r=>r.dk===dk&&r.department===dep);
        const flds={date:epoch(dk),department:dep,cash_actual:v,
          expected_at_submit:expectedCash(dk,dep),submitted_by:"дашборд"};
        if(ex){ if((ex.cash_actual||0)!==v) acts.push(["UpdateRecord","CashReconciliation",ex.id,flds]); }
        else acts.push(["AddRecord","CashReconciliation",null,flds]);});
      if(!acts.length){uiMsg="Ошибка: не заполнено ни одной суммы";render();return;}
      bulkBtn.disabled=true;
      try{ await grist.docApi.applyUserActions(acts);
        modal=null;uiMsg="";await loadAll();render();
      }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}
    };
  }
  wireExpList();
  const delExpBtn=document.getElementById("f-delexp");
  if(delExpBtn)delExpBtn.onclick=async()=>{
    delExpBtn.disabled=true;
    try{ await grist.docApi.applyUserActions([["RemoveRecord","Expenses",fv.id]]);
      modal=null;uiMsg="";await loadAll();render();
    }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}};
  document.querySelectorAll("[data-delcr]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.delcr;
    const r=cashrec.find(x=>x.id===id);
    modal="delcr";fv={id,label:`${RU_DD(r?.dk||"")}, ${depName(r?.department)}, ${fmt(r?.cash_actual||0)} ₸`};
    uiMsg="";render();
  });
  const delBtn=document.getElementById("f-delcr");
  if(delBtn)delBtn.onclick=async()=>{
    delBtn.disabled=true;
    try{ await grist.docApi.applyUserActions([["RemoveRecord","CashReconciliation",fv.id]]);
      modal=null;uiMsg="";await loadAll();render();
    }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}
  };
  document.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{
    modal="cash";uiMsg="";
    fv={date:b.dataset.day||addDays(dayKey(new Date()),-1),dep:b.dataset.hand};
    render();
  });
  document.querySelectorAll("[data-unpay]").forEach(b=>b.onclick=async()=>{
    const id=+b.dataset.unpay, bill=bills.find(x=>x.id===id); if(!bill)return;
    b.disabled=true; b.textContent="…";
    // расход, созданный этой оплатой, ищем по ключу счёта
    const linked=expenses.filter(e=>e.pay_ref&&e.pay_ref===bill.bill_key);
    const acts=linked.map(e=>["RemoveRecord","Expenses",e.id]);
    acts.push(["UpdateRecord","PayQueue",id,
      {paid:false,paid_date:null,expense_created:false}]);
    try{ await grist.docApi.applyUserActions(acts);
      await loadAll(); render();
    }catch(e){ b.disabled=false; b.textContent="Отменить оплату";
      uiMsg="Ошибка: "+(e.message||e); render(); }
  });
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=async()=>{
    const id=+b.dataset.pay,bill=bills.find(x=>x.id===id);if(!bill)return;
    const acc=+document.querySelector(`[data-accfor="${id}"]`).value;
    const cat=+(document.querySelector(`[data-catfor="${id}"]`)||{}).value||bill.category||0;
    b.disabled=true;b.textContent="…";
    const t=dayKey(new Date());
    try{
      await grist.docApi.applyUserActions([
        ["UpdateRecord","PayQueue",id,{paid:true,paid_date:epoch(t),paid_account:acc,category:cat,expense_created:true}],
        ["AddRecord","Expenses",null,{date:epoch(t),department:bill.department||0,category:cat,
          amount:bill.amount||0,account:acc,period:t.slice(0,7),source:"закуп",
          supplier:bill.supplier||"",note:"Оплата счёта"+(bill.request_no?" по заявке "+bill.request_no:""),
          pay_ref:bill.bill_key||String(id),created_by:"дашборд"}]]);
      await loadAll();render();
    }catch(e){b.disabled=false;b.textContent="Оплачено";uiMsg="Ошибка: "+(e.message||e);render();}
  });
 }catch(e){console.error("wire:",e);}
}

// клик мимо дропдауна закрывает его; Escape закрывает модалку
document.addEventListener("click",e=>{
  const dd=document.getElementById("depdd");
  if(dd&&dd.open&&!e.target.closest("#depdd")){dd.open=false;openDD=false;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&modal){modal=null;uiMsg="";render();}
});

grist.ready({requiredAccess:"full"});
grist.onRecords(async rows=>{
  recs=rows;
  try{await loadAll();loadError="";}
  catch(e){loadError=String(e&&e.message||e);console.warn("loadAll:",e);}
  render();
});
</script>
</body>
