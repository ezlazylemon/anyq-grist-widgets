<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Касса APORT</title>
<style>
  :root{
    --bg:#F1F2F4; --card:#FFFFFF; --ink:#1F2328; --muted:#68707A; --line:#D9DDE2;
    --accent:#2563B8; --up:#188A50; --down:#C6402E;
    --cash:#B98A2F; --kaspi:#E2483B; --halyk:#1DA860; --bck:#2563B8; --deliv:#7C5CD6; --other:#98A0A8;
    --input:#FFFFFF; --hover:#F4F6F8; --up-bg:#E5F4EC; --down-bg:#FBEAE7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17191C; --card:#1F2226; --ink:#E8EAEC; --muted:#8C939B; --line:#33383E;
           --input:#191C1F; --hover:#262A2F; --up-bg:#173226; --down-bg:#3A211D; }
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:13px; line-height:1.4; padding:12px 14px 22px}
  .num{font-variant-numeric:tabular-nums}
  h2{font-size:13px; font-weight:600; margin-bottom:8px; display:flex; align-items:baseline; gap:8px}
  h2 .sub{color:var(--muted); font-weight:400; font-size:12px}
  h2 .cnt{margin-left:auto; color:var(--muted); font-weight:400; font-size:12px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 14px}
  button{font:inherit; cursor:pointer}
  select,input{font:inherit; color:var(--ink); background:var(--input);
    border:1px solid var(--line); border-radius:5px; padding:5px 8px; max-width:100%}
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .toolbar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px}
  .pills{display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--card)}
  .pill{border:0; border-right:1px solid var(--line); background:transparent; color:var(--ink); padding:6px 11px}
  .pill:last-child{border-right:0}
  .pill.on{background:var(--accent); color:#fff}
  .range{display:flex; gap:4px; align-items:center}
  .dd{position:relative}
  .dd>summary{list-style:none; cursor:pointer; border:1px solid var(--line); background:var(--card);
    border-radius:6px; padding:6px 11px; user-select:none; white-space:nowrap}
  .dd>summary::-webkit-details-marker{display:none}
  .dd .menu{position:absolute; z-index:30; top:calc(100% + 4px); left:0; min-width:240px; max-height:300px; overflow:auto;
    background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px; box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .dd .menu .tools{display:flex; gap:6px; margin-bottom:6px}
  .dd .menu .tools button{border:1px solid var(--line); background:transparent; color:var(--accent); border-radius:5px; padding:3px 8px; font-size:12px}
  .dd .menu label{display:flex; gap:7px; align-items:center; padding:3px 4px; border-radius:4px}
  .dd .menu label:hover{background:var(--hover)}
  .btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:6px; padding:6px 11px}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .btn.ghost{color:var(--accent); border-color:var(--accent)}
  .btn:disabled{opacity:.5; cursor:default}
  .spacer{flex:1}

  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:10px}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:9px 12px}
  .kpi .t{color:var(--muted); font-size:12px}
  .kpi .v{font-size:19px; font-weight:600; margin-top:2px}
  .kpi .v.pos{color:var(--up)} .kpi .v.neg{color:var(--down)}
  .kpi .d{font-size:12px; margin-top:1px}
  .kpi .d.up{color:var(--up)} .kpi .d.down{color:var(--down)} .kpi .d.mut{color:var(--muted)}

  .grid{display:grid; gap:10px; grid-template-columns:1fr 1fr}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}
  .grid .wide{grid-column:1/-1}

  .split{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
  .donut{flex:none}
  .lg{display:flex; flex-direction:column; gap:3px; min-width:150px; flex:1}
  .lg .it{display:flex; gap:7px; align-items:baseline}
  .lg .sq{width:9px; height:9px; border-radius:2px; flex:none; align-self:center}
  .lg .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lg .vv{font-weight:600} .lg .pp{color:var(--muted); width:38px; text-align:right}

  .rows{display:flex; flex-direction:column; gap:4px; max-height:330px; overflow:auto}
  .row{display:grid; grid-template-columns:minmax(84px,34%) 1fr auto; gap:9px; align-items:center; padding:1px 0}
  .row .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .track{height:7px; border-radius:3px; background:var(--line); overflow:hidden}
  .row .track i{display:block; height:100%; background:var(--accent)}
  .row .val{font-size:12px}
  .row.zero .name,.row.zero .val{color:var(--down); font-weight:600}

  .chart{display:flex; align-items:flex-end; gap:3px; height:120px; padding-top:14px; overflow-x:auto}
  .cb{flex:1 0 14px; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:14px; position:relative}
  .cb{max-width:52px}
  .cb i{display:block; width:100%; background:var(--line); border-radius:2px 2px 0 0}
  .cb.insel i{background:var(--accent)}
  .cb.today i{background:var(--kaspi)}
  .cb.insel .lbl{color:var(--ink); font-weight:600}
  .cb .lbl{font-size:10px; color:var(--muted); white-space:nowrap}
  .cb:hover::after{content:attr(data-tip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--card); font-size:11px; padding:2px 7px; border-radius:4px; white-space:nowrap; z-index:5}

  table{width:100%; border-collapse:collapse}
  th{font-size:11px; color:var(--muted); font-weight:500; text-align:right; padding:3px 6px; border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:4px 6px; text-align:right; border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  td.pos{color:var(--up); font-weight:600} td.neg{color:var(--down); font-weight:600}

  .list{display:flex; flex-direction:column; max-height:280px; overflow:auto}
  .li{display:flex; gap:9px; align-items:baseline; padding:6px 2px; border-top:1px solid var(--line)}
  .li:first-child{border-top:0}
  .li .d{color:var(--muted); font-size:12px; flex:none; width:42px}
  .li .t{flex:1; min-width:0}
  .li .t .sub{color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .li .a{font-weight:600; white-space:nowrap}
  .li.bill .a{color:var(--down)}
  .payrow{display:flex; gap:5px; align-items:center; flex:none}
  .empty-line{color:var(--muted); padding:12px 2px}
  .badge{font-size:11px; font-weight:600; border-radius:4px; padding:2px 7px; white-space:nowrap}
  .badge.up{background:var(--up-bg); color:var(--up)}
  .badge.down{background:var(--down-bg); color:var(--down)}
  .badge.zero{background:var(--hover); color:var(--muted)}
  .del{border:0; background:none; color:var(--muted); font-size:16px; line-height:1; padding:0 2px; flex:none}
  .del:hover{color:var(--down)}
  .btn.sm{padding:3px 9px; font-size:12px}
  details.nh{margin-top:8px; border-top:1px solid var(--line); padding-top:8px}
  details.nh summary{cursor:pointer; color:var(--down); font-weight:600; list-style:none}
  details.nh summary::-webkit-details-marker{display:none}
  details.nh summary::before{content:"▸ "}
  details.nh[open] summary::before{content:"▾ "}
  .nhlist{margin-top:6px; max-height:260px; overflow:auto}
  .nhday{font-size:11px; color:var(--muted); font-weight:600; padding:7px 0 2px; position:sticky; top:0; background:var(--card)}
  .nhrow{display:flex; gap:9px; align-items:center; padding:3px 0}
  .nhrow .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* модальные окна */
  .mback{position:fixed; inset:0; background:rgba(15,17,20,.45); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:40px 14px}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:8px;
    width:100%; max-width:460px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .modal h3{font-size:14px; margin-bottom:10px; display:flex}
  .modal h3 .x{margin-left:auto; border:0; background:none; color:var(--muted); font-size:18px; line-height:1; padding:0 2px}
  .form{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .form .widef{grid-column:1/-1}
  .form label{display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted)}
  .form label>*{width:100%}
  .hint{grid-column:1/-1; font-size:12px; color:var(--muted); background:var(--hover); border-radius:5px; padding:6px 9px}
  .hint b.pos{color:var(--up)} .hint b.neg{color:var(--down)}
  .msg{font-size:12px; margin-left:8px}
  .msg.ok{color:var(--up)} .msg.err{color:var(--down)}
  .foot{margin-top:8px; color:var(--muted); font-size:11px}
  .empty{padding:40px 20px; text-align:center; color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="empty">Загрузка данных…</div></div>
<script src="https://work.anyq.chat/grist-plugin-api.js"></script>
<script>
"use strict";
const CH=[
 {k:"cash",n:"Наличные",c:"var(--cash)"},{k:"kaspi",n:"Kaspi",c:"var(--kaspi)"},
 {k:"halyk",n:"Halyk",c:"var(--halyk)"},{k:"bck",n:"БЦК",c:"var(--bck)"},
 {k:"deliv",n:"Доставка",c:"var(--deliv)"},{k:"other",n:"Прочее",c:"var(--other)"}];
const DELIV=["glovo","wolt","chocofood","yandex"];
const CATC=["#2563B8","#E2483B","#1DA860","#B98A2F","#7C5CD6","#D97706","#0E7490","#BE185D","#4D7C0F","#98A0A8"];
const TZ="Asia/Aqtobe";
const fmt=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n);
const dayKey=d=>new Intl.DateTimeFormat("sv-SE",{timeZone:TZ}).format(d);
const RU_D=k=>new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"numeric",month:"long"}).format(new Date(k+"T12:00:00"));
const RU_DD=k=>new Intl.DateTimeFormat("ru-RU",{timeZone:TZ,day:"2-digit",month:"2-digit"}).format(new Date(k+"T12:00:00"));
const addDays=(k,n)=>{const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return dayKey(d);};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const epoch=k=>Math.floor(Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))/1000);
const plural=(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;
  return a>10&&a<20?many:b>1&&b<5?few:b===1?one:many;};

let recs=[],deps={},depOrder=[],nameToId={},cats={},catOrder=[],accs={},accOrder=[];
let expenses=[],bills=[],cashrec=[];
let period="today",cFrom="",cTo="";
let sel=new Set(), selInit=false;   // выбранные точки; по умолчанию — все, галочки стоят
let openDD=false, modal=null, uiMsg="", fv={};

const depId=v=>typeof v==="number"?v:(Array.isArray(v)?(+v[v.length-1]||0):(nameToId[String(v)]||0));
const depName=id=>deps[id]?.name||("#"+id);
const shortName=id=>depName(id);
const inSel=id=>sel.has(id);
const cols=t=>{const ks=Object.keys(t),n=t.id.length,out=[];
  for(let i=0;i<n;i++){const o={};ks.forEach(k=>o[k]=t[k][i]);out.push(o);}return out;};
const dstr=v=>v instanceof Date?dayKey(v):(typeof v==="number"?dayKey(new Date(v*1000)):String(v||""));

async function loadAll(){
  const [d,c,a,e,b,cr]=await Promise.all(
    ["Departments","ExpenseCategories","Accounts","Expenses","PayQueue","CashReconciliation"]
    .map(t=>grist.docApi.fetchTable(t)));
  deps={};depOrder=[];nameToId={};
  cols(d).forEach(r=>{deps[r.id]=r;nameToId[r.name]=r.id;if(r.is_sales)depOrder.push(r.id);});
  cats={};catOrder=[];
  cols(c).forEach(r=>{cats[r.id]=r;if(r.active!==false)catOrder.push(r.id);});
  accs={};accOrder=[];
  cols(a).forEach(r=>{accs[r.id]=r;accOrder.push(r.id);});
  expenses=cols(e).map(r=>({...r,dk:dstr(r.date)})).sort((x,y)=>y.dk.localeCompare(x.dk)||y.id-x.id);
  bills=cols(b).map(r=>({...r,dk:dstr(r.date_added)}));
  cashrec=cols(cr).map(r=>({...r,dk:dstr(r.date)})).sort((x,y)=>y.dk.localeCompare(x.dk)||y.id-x.id);
  if(!selInit&&depOrder.length){sel=new Set(depOrder);selInit=true;}
}

function range(){
  const t=dayKey(new Date());
  if(period==="today")return[t,t];
  if(period==="yest"){const y=addDays(t,-1);return[y,y];}
  if(period==="7d")return[addDays(t,-6),t];
  if(period==="month")return[t.slice(0,8)+"01",t];
  if(period==="custom"){const f=cFrom||t,to=cTo||t;return f<=to?[f,to]:[to,f];}
  return["0000-01-01",t];
}
const PERIODS=[["today","Сегодня"],["yest","Вчера"],["7d","7 дней"],["month","Месяц"],["all","Всё"],["custom","Свой период"]];

function chanSums(rows){
  const s={cash:0,kaspi:0,halyk:0,bck:0,deliv:0,other:0,total:0};
  for(const r of rows){
    for(const c of ["cash","kaspi","halyk","bck","other"])s[c]+=r[c]||0;
    for(const c of DELIV)s.deliv+=r[c]||0;
    s.total+=r.total||0;}
  return s;
}

function donut(parts,size){
  const tot=parts.reduce((a,p)=>a+p.v,0);
  if(tot<=0)return"";
  const R=size/2-8,C=2*Math.PI*R;let off=C/4;
  const segs=parts.map(p=>{
    const len=p.v/tot*C;
    const s=`<circle r="${R}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${p.c}"
      stroke-width="15" stroke-dasharray="${Math.max(len-1,0.5).toFixed(2)} ${(C-len+1).toFixed(2)}"
      stroke-dashoffset="${off.toFixed(2)}"><title>${esc(p.label)}: ${fmt(p.v)} ₸ (${(p.v/tot*100).toFixed(1)}%)</title></circle>`;
    off-=len;return s;}).join("");
  return `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img">${segs}</svg>`;
}
function legend(parts){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1;
  return `<div class="lg">`+parts.map(p=>`<div class="it"><span class="sq" style="background:${p.c}"></span>
    <span class="nm">${esc(p.label)}</span><span class="vv num">${fmt(p.v)}</span>
    <span class="pp num">${(p.v/tot*100).toFixed(0)}%</span></div>`).join("")+`</div>`;
}

function cashHint(dk,dep,amt){
  const expd=expectedCash(dk,dep);
  const act=parseFloat(amt);
  let h=`Ожидается за ${RU_DD(dk)}: <b class="num">${fmt(expd)} ₸</b>`;
  if(!isNaN(act)){
    const d=Math.round((act-expd)*100)/100;
    h+= d===0?`. <b class="pos">Сойдётся ровно</b>`
      : d>0?`. Излишек: <b class="pos">+${fmt(d)} ₸</b>`
           :`. Недосдача: <b class="neg">−${fmt(-d)} ₸</b>`;
  }
  return h;
}
// ожидаемая сдача, посчитанная на клиенте для подсказки в форме
function expectedCash(dk,dep){
  let cash=0;
  for(const r of recs){ if(dstr(r.date)===dk&&depId(r.department)===dep) cash+=r.cash||0; }
  let spent=0;
  for(const e of expenses){ if(e.dk===dk&&e.department===dep&&accs[e.account]?.name==="Касса точки") spent+=e.amount||0; }
  return Math.round((cash-spent)*100)/100;
}

function modalHtml(){
  if(!modal)return"";
  const todayK=dayKey(new Date());
  if(modal==="delcr"){
    return `<div class="mback" data-close><div class="modal">
      <h3>Удалить запись сдачи<button class="x" data-close aria-label="Закрыть">×</button></h3>
      <div class="form">
        <div class="hint widef">${esc(fv.label||"")}</div>
        <div class="widef"><button class="btn primary" id="f-delcr">Удалить</button>
          <button class="btn" data-close>Отмена</button>
          <span class="msg err">${esc(uiMsg)}</span></div>
      </div></div></div>`;
  }
  if(modal==="exp"){
    return `<div class="mback" data-close><div class="modal">
      <h3>Новый расход<button class="x" data-close aria-label="Закрыть">×</button></h3>
      <div class="form">
        <label>Дата<input type="date" id="f-date" value="${fv.date||todayK}"></label>
        <label>Точка<select id="f-dep">${depOrder.map(id=>`<option value="${id}"${(fv.dep?+fv.dep===id:(sel.size===1&&sel.has(id)))?" selected":""}>${esc(depName(id))}</option>`).join("")}</select></label>
        <label>Статья<select id="f-cat">${catOrder.map(id=>`<option value="${id}"${fv.cat==id?" selected":""}>${esc(cats[id].name)}</option>`).join("")}</select></label>
        <label>Счёт списания<select id="f-acc">${accOrder.map(id=>`<option value="${id}"${fv.acc==id?" selected":""}>${esc(accs[id].name)}</option>`).join("")}</select></label>
        <label>Сумма, ₸<input type="number" id="f-amt" min="1" step="1" value="${fv.amt||""}" placeholder="0"></label>
        <label>Поставщик<input type="text" id="f-sup" value="${esc(fv.sup||"")}" placeholder="необязательно"></label>
        <label class="widef">Комментарий<input type="text" id="f-note" value="${esc(fv.note||"")}" placeholder="за что"></label>
        <div class="widef"><button class="btn primary" id="f-add">Записать расход</button>
          <span class="msg ${uiMsg.startsWith("Ошибка")?"err":"ok"}">${esc(uiMsg)}</span></div>
      </div></div></div>`;
  }
  // сдача наличных
  const dk=fv.date||addDays(todayK,-1);
  const dep=+(fv.dep||((sel.size===1&&[...sel][0])||depOrder[0]));
  const hint=cashHint(dk,dep,fv.amt);
  const exist=cashrec.find(r=>r.dk===dk&&r.department===dep);
  return `<div class="mback" data-close><div class="modal">
    <h3>Сдача наличных<button class="x" data-close aria-label="Закрыть">×</button></h3>
    <div class="form">
      <label>За какой день<input type="date" id="f-date" value="${dk}"></label>
      <label>Точка<select id="f-dep">${depOrder.map(id=>`<option value="${id}"${dep===id?" selected":""}>${esc(depName(id))}</option>`).join("")}</select></label>
      <label class="widef">Сдано фактически, ₸<input type="number" id="f-amt" min="0" step="1" value="${fv.amt||""}" placeholder="0"></label>
      <div class="hint" id="cash-hint">${hint}</div>
      ${exist?`<div class="hint" id="cash-exist">За этот день сдача уже внесена (${fmt(exist.cash_actual||0)} ₸). Запись будет обновлена.</div>`:``}
      <label class="widef">Комментарий<input type="text" id="f-note" value="${esc(fv.note??(exist?exist.note:"")??"")}" placeholder="необязательно"></label>
      <div class="widef"><button class="btn primary" id="f-cash">${exist?"Обновить сдачу":"Записать сдачу"}</button>
        <span class="msg ${uiMsg.startsWith("Ошибка")?"err":"ok"}">${esc(uiMsg)}</span></div>
    </div></div></div>`;
}

function render(){
  const app=document.getElementById("app");
  const [from,to]=range();
  const todayK=dayKey(new Date());
  const rvRows=recs.filter(r=>{const k=dstr(r.date);return k>=from&&k<=to&&inSel(depId(r.department));});
  const cur=chanSums(rvRows);
  const exp=expenses.filter(r=>r.dk>=from&&r.dk<=to&&inSel(r.department));
  const expSum=exp.reduce((a,r)=>a+(r.amount||0),0);
  const net=cur.total-expSum;

  const len=Math.round((new Date(to)-new Date(from))/864e5)+1;
  const pFrom=addDays(from,-len),pTo=addDays(from,-1);
  const prev=chanSums(recs.filter(r=>{const k=dstr(r.date);return k>=pFrom&&k<=pTo&&inSel(depId(r.department));}));
  let dHtml='<span class="d mut">&nbsp;</span>';
  if(prev.total>0&&period!=="all"){
    const d=(cur.total-prev.total)/prev.total*100;
    dHtml=`<span class="d ${d>=0?"up":"down"}">${d>=0?"+":"−"}${Math.abs(d).toFixed(1)}% к пред. периоду</span>`;}

  const pills=PERIODS.map(([k,n])=>`<button class="pill${period===k?" on":""}" data-p="${k}">${n}</button>`).join("");
  const custom=period==="custom"?`<span class="range">с
      <input type="date" id="c-from" value="${cFrom||from}"> по
      <input type="date" id="c-to" value="${cTo||to}"></span>`:"";
  const depLabel=sel.size===depOrder.length?"Точки: все"
    :sel.size===0?"Точки: ни одной"
    :sel.size===1?depName([...sel][0]):`Точки: ${sel.size} из ${depOrder.length}`;
  const menu=`<div class="menu">
    <input type="search" id="depsearch" placeholder="Поиск точки" style="width:100%;margin-bottom:6px">
    <div class="tools"><button data-selall>Выбрать все</button><button data-selnone>Сбросить</button></div>`+
    depOrder.map(id=>`<label data-nm="${esc(depName(id).toLowerCase())}"><input type="checkbox" data-dep="${id}"${sel.has(id)?" checked":""}>${esc(depName(id))}</label>`).join("")+`</div>`;

  const cover=expSum>0?cur.total/expSum*100:null;
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="t">Выручка</div><div class="v num">${fmt(cur.total)} ₸</div>${dHtml}</div>
    <div class="kpi"><div class="t">Расходы</div><div class="v num">${fmt(expSum)} ₸</div><span class="d mut">${exp.length} операций</span></div>
    <div class="kpi"><div class="t">Чистый доход</div><div class="v num ${net>=0?"pos":"neg"}">${fmt(net)} ₸</div>
      ${net>=0?`<span class="d up">в плюсе</span>`:`<span class="d down">до нуля не хватает ${fmt(-net)} ₸</span>`}</div>
    <div class="kpi"><div class="t">Ноль (порог выручки)</div><div class="v num">${fmt(expSum)} ₸</div>
      ${cover===null?`<span class="d mut">расходов нет</span>`
        :`<span class="d ${cover>=100?"up":"down"}">покрыто на ${cover.toFixed(0)}%</span>`}</div>
  </div>`;

  const chParts=CH.filter(c=>cur[c.k]>0).map(c=>({v:cur[c.k],c:c.c,label:c.n}));
  const byCat={};
  exp.forEach(r=>{byCat[r.category]=(byCat[r.category]||0)+(r.amount||0);});
  const catParts=Object.entries(byCat).sort((a,b)=>b[1]-a[1])
    .map(([id,v],i)=>({v,c:CATC[i%CATC.length],label:cats[id]?.name||"—"}));

  const byDep={};
  rvRows.forEach(r=>{const id=depId(r.department);byDep[id]=(byDep[id]||0)+(r.total||0);});
  const pts=depOrder.filter(inSel).map(id=>({id,v:byDep[id]||0})).sort((a,b)=>b.v-a.v);
  const maxV=pts[0]?.v||1;
  const ptRows=pts.map(p=>`<div class="row${p.v===0?" zero":""}">
    <span class="name" title="${esc(depName(p.id))}">${esc(shortName(p.id))}</span>
    <span class="track"><i style="width:${(p.v/maxV*100).toFixed(1)}%"></i></span>
    <span class="val num">${p.v===0?"0":fmt(p.v)}</span></div>`).join("")
    ||`<div class="empty-line">Нет данных за период.</div>`;

  // график всегда показывает контекст последних дней; выбранный период подсвечен
  const byDay={};
  recs.filter(r=>inSel(depId(r.department))).forEach(r=>{const k=dstr(r.date);byDay[k]=(byDay[k]||0)+(r.total||0);});
  const span=Math.max(len,14);
  const dks=[];
  for(let k=addDays(to,-(span-1));k<=to;k=addDays(k,1))dks.push(k);
  const dmax=Math.max(...dks.map(k=>byDay[k]||0),1);
  const chart=dks.map(k=>{
    const v=byDay[k]||0,h=Math.max(Math.round(v/dmax*86),2);
    const cls=(k===todayK?" today":"")+(k>=from&&k<=to?" insel":"");
    return `<div class="cb${cls}" data-tip="${RU_D(k)}: ${fmt(v)} ₸">
      <i style="height:${h}px"></i><span class="lbl">${+k.slice(8)}</span></div>`;}).join("");

  const accRow=id=>{
    const a=accs[id];if(!a)return"";
    const chans=(a.revenue_cols||"").split(",").map(s=>s.trim()).filter(Boolean);
    let inflow=0;
    for(const r of rvRows)for(const c of chans)inflow+=r[c]||0;
    const out=exp.filter(e=>e.account===id).reduce((s,e)=>s+(e.amount||0),0);
    if(!inflow&&!out)return"";
    const n=inflow-out;
    return `<tr><td>${esc(a.name)}</td><td class="num">${fmt(inflow)}</td>
      <td class="num">${out?"−"+fmt(out):"0"}</td>
      <td class="num ${n>=0?"pos":"neg"}">${fmt(n)}</td></tr>`;};
  const cfRows=accOrder.map(accRow).filter(Boolean).join("")
    ||`<tr><td colspan="4" class="empty-line" style="text-align:left">Нет движения за период.</td></tr>`;

  // сверка касс: записи за период (по дате сдачи) + бейдж
  // сдачи не привязаны к выбранному периоду: их вносят за прошлые дни
  const crAll=cashrec.filter(r=>inSel(r.department));
  const crs=crAll.slice(0,20);
  const crList=crs.map(r=>{
    const d=r.diff||0;
    const badge=d===0?`<span class="badge zero">сошлось</span>`
      :d>0?`<span class="badge up">излишек +${fmt(d)}</span>`
           :`<span class="badge down">недосдача −${fmt(-d)}</span>`;
    return `<div class="li"><span class="d num">${RU_DD(r.dk)}</span>
      <span class="t"><b>${esc(shortName(r.department))}</b>
        <div class="sub">ожидалось ${fmt(r.cash_expected||0)}, сдано ${fmt(r.cash_actual||0)}${r.note?", "+esc(r.note):""}</div></span>
      ${badge}<button class="del" data-delcr="${r.id}" title="Удалить запись">×</button></div>`;}).join("")
    ||`<div class="empty-line">Сдач ещё не вносили. Раскройте список ниже и нажмите «Внести».</div>`;
  // несданная касса за ВСЕ закрытые дни (сегодня не считаем, день идёт)
  const cashByDay={};   // day -> {depId: cash}
  recs.forEach(r=>{
    const k=dstr(r.date); if(k>=todayK)return;
    const id=depId(r.department); const c=r.cash||0; if(c<=0)return;
    (cashByDay[k]||={})[id]=(cashByDay[k][id]||0)+c;});
  const handedSet=new Set(cashrec.map(r=>r.dk+"|"+r.department));
  const debtDays=[];
  let debtSum=0,debtCount=0;
  Object.keys(cashByDay).sort().reverse().forEach(k=>{
    const list=Object.entries(cashByDay[k])
      .filter(([id])=>!handedSet.has(k+"|"+id)&&inSel(+id))
      .map(([id,v])=>({id:+id,v})).sort((a,b)=>b.v-a.v);
    if(!list.length)return;
    const s=list.reduce((a,x)=>a+x.v,0);
    debtSum+=s; debtCount+=list.length;
    debtDays.push({k,list,s});});
  const shown=debtDays.slice(0,10);
  const nhLine=debtDays.length?`<details class="nh"><summary>Не сдана касса за ${debtDays.length} ${plural(debtDays.length,"день","дня","дней")}: ${fmt(debtSum)} ₸</summary>
    <div class="nhlist">`+shown.map(d=>`<div class="nhday">${RU_D(d.k)}: ${d.list.length} ${plural(d.list.length,"точка","точки","точек")}, ${fmt(d.s)} ₸</div>`+
      d.list.map(x=>`<div class="nhrow"><span class="nm">${esc(shortName(x.id))}</span>
        <span class="num">${fmt(x.v)}</span>
        <button class="btn ghost sm" data-hand="${x.id}" data-day="${d.k}">Внести</button></div>`).join("")).join("")+
      (debtDays.length>shown.length?`<div class="nhday">и ещё ${debtDays.length-shown.length} ${plural(debtDays.length-shown.length,"день","дня","дней")}</div>`:``)+
    `</div></details>`:"";

  const unpaid=bills.filter(r=>!r.paid&&inSel(r.department)).sort((a,b)=>a.dk.localeCompare(b.dk));
  const accSel=id=>`<select data-accfor="${id}">${accOrder.filter(a=>accs[a].name!=="Касса точки")
    .map(a=>`<option value="${a}">${esc(accs[a].name)}</option>`).join("")}</select>`;
  const billList=unpaid.map(r=>`<div class="li bill">
    <span class="d num">${r.dk?RU_DD(r.dk):""}</span>
    <span class="t"><b>${esc(r.supplier||"Поставщик")}</b>
      <div class="sub">${esc(shortName(r.department))}${r.request_no?", заявка "+esc(r.request_no):""}</div></span>
    <span class="a num">${fmt(r.amount||0)}</span>
    <span class="payrow">${accSel(r.id)}<button class="btn primary" data-pay="${r.id}">Оплачено</button></span></div>`).join("")
    ||`<div class="empty-line">Неоплаченных счетов нет.</div>`;

  const expList=exp.slice(0,30).map(r=>`<div class="li">
    <span class="d num">${RU_DD(r.dk)}</span>
    <span class="t"><b>${esc(cats[r.category]?.name||"—")}</b>
      <div class="sub">${esc(shortName(r.department))}${r.supplier?", "+esc(r.supplier):""}${r.note?", "+esc(r.note):""}</div></span>
    <span class="a num">−${fmt(r.amount||0)}</span></div>`).join("")
    ||`<div class="empty-line">Расходов за период нет.</div>`;

  app.innerHTML=`
    <div class="toolbar">
      <div class="pills">${pills}</div>${custom}
      <details class="dd" id="depdd"${openDD?" open":""}><summary>${esc(depLabel)}</summary>${menu}</details>
      <span class="spacer"></span>
      <button class="btn primary" id="btn-exp">+ Расход</button>
      <button class="btn ghost" id="btn-cash">Сдача наличных</button>
      <button class="btn" id="btn-refresh" title="Перечитать данные">⟳</button>
    </div>
    ${kpis}
    <div class="grid">
      <div class="card"><h2>Выручка по каналам <span class="cnt">${from===to?RU_D(from):RU_DD(from)+"-"+RU_DD(to)}</span></h2>
        ${chParts.length?`<div class="split">${donut(chParts,150)}${legend(chParts)}</div>`:`<div class="empty-line">Продаж нет.</div>`}</div>
      <div class="card"><h2>Расходы по статьям <span class="cnt">−${fmt(expSum)} ₸</span></h2>
        ${catParts.length?`<div class="split">${donut(catParts,150)}${legend(catParts)}</div>`:`<div class="empty-line">Расходов за период нет.</div>`}</div>
      <div class="card"><h2>Точки <span class="sub">выручка за период</span><span class="cnt">${pts.filter(p=>p.v>0).length} из ${pts.length} с продажами</span></h2>
        <div class="rows">${ptRows}</div></div>
      <div class="card"><h2>Динамика по дням <span class="sub">₸, красный столбец: сегодня</span></h2>
        <div class="chart">${chart}</div></div>
      <div class="card"><h2>Сверка касс <span class="sub">последние сдачи</span><span class="cnt">${crAll.length?`всего ${crAll.length}`:""}</span></h2>
        <div class="list">${crList}</div>${nhLine}</div>
      <div class="card"><h2>Cashflow по счетам <span class="sub">за период</span></h2>
        <table><tr><th>Счёт</th><th>Приход</th><th>Расход</th><th>Нетто</th></tr>${cfRows}</table></div>
      <div class="card"><h2>Счета к оплате<span class="cnt">${unpaid.length} шт · ${fmt(unpaid.reduce((a,r)=>a+(r.amount||0),0))} ₸</span></h2>
        <div class="list">${billList}</div></div>
      <div class="card"><h2>Расходы <span class="sub">за период, новые сверху</span><span class="cnt">${exp.length} шт · −${fmt(expSum)} ₸</span></h2>
        <div class="list">${expList}</div></div>
    </div>
    ${modalHtml()}`;
  wire();
}

const grabForm=()=>{const g=id=>document.getElementById(id);
  return {date:g("f-date")?.value,dep:g("f-dep")?.value,cat:g("f-cat")?.value,
          acc:g("f-acc")?.value,amt:g("f-amt")?.value,sup:g("f-sup")?.value,note:g("f-note")?.value};};

function wire(){
  document.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{period=b.dataset.p;uiMsg="";render();});
  const cf=document.getElementById("c-from"),ct=document.getElementById("c-to");
  if(cf)cf.onchange=e=>{cFrom=e.target.value;render();};
  if(ct)ct.onchange=e=>{cTo=e.target.value;render();};
  const dd=document.getElementById("depdd");
  dd.addEventListener("toggle",()=>{openDD=dd.open;});
  // живое применение: перерисовка сразу, дропдаун остаётся открытым,
  // поиск и прокрутка списка сохраняются
  const rerenderKeepDD=()=>{
    const q=document.getElementById("depsearch")?.value||"";
    const st=dd.querySelector(".menu")?.scrollTop||0;
    render();
    const dd2=document.getElementById("depdd");
    const ds2=document.getElementById("depsearch");
    if(ds2&&q){ds2.value=q;ds2.dispatchEvent(new Event("input"));}
    const m2=dd2?.querySelector(".menu"); if(m2)m2.scrollTop=st;
  };
  dd.querySelectorAll("[data-dep]").forEach(cb=>cb.onchange=()=>{
    const id=+cb.dataset.dep;cb.checked?sel.add(id):sel.delete(id);
    rerenderKeepDD();});
  dd.querySelector("[data-selall]").onclick=()=>{sel=new Set(depOrder);rerenderKeepDD();};
  dd.querySelector("[data-selnone]").onclick=()=>{sel.clear();rerenderKeepDD();};
  const ds=document.getElementById("depsearch");
  if(ds)ds.oninput=()=>{
    const q=ds.value.trim().toLowerCase();
    dd.querySelectorAll("label[data-nm]").forEach(l=>{
      l.style.display=!q||l.dataset.nm.includes(q)?"":"none";});};
  document.getElementById("btn-refresh").onclick=async()=>{await loadAll();render();};
  document.getElementById("btn-exp").onclick=()=>{modal="exp";fv={};uiMsg="";render();};
  document.getElementById("btn-cash").onclick=()=>{modal="cash";fv={};uiMsg="";render();};

  // модалка: закрытие по фону/крестику, живой пересчёт подсказки сдачи
  document.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click",e=>{
    if(e.target===el||el.tagName==="BUTTON"){modal=null;uiMsg="";render();}}));
  if(modal==="cash"){
    // ввод обновляет только строку подсказки, без перерисовки страницы
    const upd=()=>{fv=grabForm();
      const h=document.getElementById("cash-hint");
      if(h)h.innerHTML=cashHint(fv.date||addDays(dayKey(new Date()),-1),+fv.dep,fv.amt);};
    ["f-date","f-dep","f-amt"].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.addEventListener("input",upd);});
    const cashBtn=document.getElementById("f-cash");
    if(cashBtn)cashBtn.onclick=async()=>{
      fv=grabForm();
      const amt=parseFloat(fv.amt);
      if(isNaN(amt)||amt<0){uiMsg="Ошибка: введите сумму";render();return;}
      cashBtn.disabled=true;
      const dk=fv.date,dep=+fv.dep;
      // одна сдача на точку и день: если запись есть, обновляем её
      const ex=cashrec.find(r=>r.dk===dk&&r.department===dep);
      const flds={date:epoch(dk),department:dep,cash_actual:amt,
        note:(fv.note||"").trim(),submitted_by:"дашборд"};
      try{
        await grist.docApi.applyUserActions([ ex
          ? ["UpdateRecord","CashReconciliation",ex.id,flds]
          : ["AddRecord","CashReconciliation",null,flds] ]);
        modal=null;uiMsg="";await loadAll();render();
      }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}
    };
  }
  if(modal==="exp"){
    const addBtn=document.getElementById("f-add");
    if(addBtn)addBtn.onclick=async()=>{
      fv=grabForm();
      const amt=parseFloat(fv.amt);
      if(!amt||amt<=0){uiMsg="Ошибка: введите сумму";render();return;}
      addBtn.disabled=true;
      try{
        const dk=fv.date||dayKey(new Date());
        await grist.docApi.applyUserActions([["AddRecord","Expenses",null,{
          date:epoch(dk),department:+fv.dep,category:+fv.cat,amount:amt,
          account:+fv.acc,period:dk.slice(0,7),source:"казначей",
          supplier:(fv.sup||"").trim(),note:(fv.note||"").trim(),created_by:"дашборд"}]]);
        modal=null;uiMsg="";await loadAll();render();
      }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}
    };
  }
  document.querySelectorAll("[data-delcr]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.delcr;
    const r=cashrec.find(x=>x.id===id);
    modal="delcr";fv={id,label:`${RU_DD(r?.dk||"")}, ${depName(r?.department)}, ${fmt(r?.cash_actual||0)} ₸`};
    uiMsg="";render();
  });
  const delBtn=document.getElementById("f-delcr");
  if(delBtn)delBtn.onclick=async()=>{
    delBtn.disabled=true;
    try{ await grist.docApi.applyUserActions([["RemoveRecord","CashReconciliation",fv.id]]);
      modal=null;uiMsg="";await loadAll();render();
    }catch(e){uiMsg="Ошибка: "+(e.message||e);render();}
  };
  document.querySelectorAll("[data-hand]").forEach(b=>b.onclick=()=>{
    modal="cash";uiMsg="";
    fv={date:b.dataset.day||addDays(dayKey(new Date()),-1),dep:b.dataset.hand};
    render();
  });
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=async()=>{
    const id=+b.dataset.pay,bill=bills.find(x=>x.id===id);if(!bill)return;
    const acc=+document.querySelector(`[data-accfor="${id}"]`).value;
    b.disabled=true;b.textContent="…";
    const t=dayKey(new Date());
    try{
      await grist.docApi.applyUserActions([
        ["UpdateRecord","PayQueue",id,{paid:true,paid_date:epoch(t),paid_account:acc,expense_created:true}],
        ["AddRecord","Expenses",null,{date:epoch(t),department:bill.department||0,category:bill.category||0,
          amount:bill.amount||0,account:acc,period:t.slice(0,7),source:"закуп",
          supplier:bill.supplier||"",note:"Оплата счёта"+(bill.request_no?" по заявке "+bill.request_no:""),
          pay_ref:bill.bill_key||String(id),created_by:"дашборд"}]]);
      await loadAll();render();
    }catch(e){b.disabled=false;b.textContent="Оплачено";uiMsg="Ошибка: "+(e.message||e);render();}
  });
}

// клик мимо дропдауна закрывает его; Escape закрывает модалку
document.addEventListener("click",e=>{
  const dd=document.getElementById("depdd");
  if(dd&&dd.open&&!e.target.closest("#depdd")){dd.open=false;openDD=false;}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&modal){modal=null;uiMsg="";render();}
});

grist.ready({requiredAccess:"full"});
grist.onRecords(async rows=>{
  recs=rows;
  try{await loadAll();}catch(e){console.warn("loadAll:",e);}
  render();
});
</script>
</body>
</html>
